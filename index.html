      multi > 1 ? "اختار " + ar(multi) + " تعالجهم" : "اختار واحد.") +
    (step === "thieves" && (state.you.partners || []).length ? "  ·  معاك " + esc(state.you.partners.join(" و")) : "") + "</p>" +
    '<div class="grid" id="nightGrid">' + alive.map(function (p) { return '<button data-a="npick:' + p.id + '" class="pick">' + esc(p.name) + "</button>"; }).join("") + "</div>" +
    '<button class="btn mt" id="nightGo" data-a="nightGo" disabled>خلاص — غمّض</button>';
  if (step === "rami") h += '<button class="btn ghost mt" data-a="nightSkip">مش دلوقتي — سيب الرصاصة لبعدين</button>';

/* ---------------------------- وضع العرض العريض (بالثلاث أعمدة) ---------------------------- */
var landscapeMode = localStorage.getItem("haramia-landscape") === "1";
async function toggleLandscape() {
  landscapeMode = !landscapeMode;
  try { localStorage.setItem("haramia-landscape", landscapeMode ? "1" : "0"); } catch (e) {}
  if (landscapeMode) {
    // محاولة قفل اتجاه الشاشة فعليًا (مش مجرد تخطيط CSS) — ده مدعوم بس على
    // Android/Chrome وبس لما الصفحة تكون Fullscreen، ومش مدعوم خالص على
    // آيفون/سفاري. لو فشل، هنفضل نستخدم تخطيط الـCSS العريض زي ما هو —
    // بيشتغل في كل الحالات، بس من غير ما يقلب اتجاه الموبايل فعليًا.
    var locked = false;
    try {
      if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
      if (screen.orientation && screen.orientation.lock) { await screen.orientation.lock("landscape"); locked = true; }
    } catch (e) { /* الجهاز أو المتصفح مش بيدعم القفل الإجباري */ }
    if (!locked) showToast("المتصفح ده مش بيدعم قفل اتجاه الشاشة إجباريًا (شائع على آيفون) — التخطيط العريض هيفضل شغال، بس هتحتاج تلف الموبايل بنفسك.");
  } else {
    try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
    try { if (document.fullscreenElement && document.exitFullscreen) await document.exitFullscreen(); } catch (e) {}
  }
  render();
}

// باج معروف وموثّق في سفاري آيفون: حالة :active مبتشتغلش خالص من غير
// مستمع لمس فعلي على الصفحة. من غيره، كل تأثيرات الضغط اللي حطيناها
// على الأزرار (بارز، بيغطس) كانت هتفضل مش ظاهرة على آيفون تحديدًا.
document.addEventListener("touchstart", function () {}, { passive: true });

// طبقة تأكيد إضافية: أي حاجة قابلة للدوس بتاخد ومضة واضحة لحظة الضغط،
// بغض النظر عن :active — عشان الشخص يبقى متأكد ١٠٠٪ إنه داس صح.
document.addEventListener("pointerdown", function (e) {

}, { passive: true });

var appEl = document.getElementById("app");
function render() {
  // لو أي خطأ حصل وقت بناء الشاشة، مننساش نحدّث الشاشة القديمة —
  // ده بالظبط اللي كان بيسبب "التجمّد": الشاشة الجديدة بتتبني كاملة
  // في الذاكرة الأول، فلو وقعت في النص، القديمة بتفضل زي ما هي للأبد.
  // دلوقتي أي خطأ رسم بيوري شاشة بديلة واضحة بدل ما يسيب المستخدم
  // واقف من غير ما يعرف حصل إيه. ولو الصفحة نفسها اتقفلت (document
  // بقى مش متاح) بنتجاهل كل حاجة بأمان تام من غير أي كراش.
  if (typeof document === "undefined" || !document.getElementById) return;
  var showLandscape = landscapeMode && client && state;
  var lWasFocused = false, lPrevValue = "";
  try {
    var lOldInput = document.getElementById("lchatinput");
    if (lOldInput) { lWasFocused = document.activeElement === lOldInput; lPrevValue = lOldInput.value; }
  } catch (e) { return; }
  try {
    var mid = view();
    appEl.innerHTML = showLandscape ? ('<div class="lwrap">' + landscapeChatHTML() + '<div class="lmid">' + mid + "</div>" + gameLogHTML() + "</div>") : mid;
    appEl.classList.toggle("lon", !!showLandscape);
  } catch (e) {
    if (window.__firebaseDebugLog) window.__firebaseDebugLog.push(
      new Date().toTimeString().slice(0, 8) + " — !! فشل بناء الشاشة: " + e.message + (e.stack ? " | " + e.stack.split("\n").slice(0, 2).join(" » ") : ""));
    try {
      appEl.innerHTML = '<div class="mid ctr"><div class="errbox">حصل خطأ في عرض الشاشة. دوس الزرار وجرّب تاني.</div>' +
        '<button class="btn dark" data-a="rerender">جرّب تاني</button></div>' + footer();
    } catch (e2) { /* الصفحة اتقفلت فعلًا */ }
    return;
  }
  try {
    if (state && state.phase === "reveal" && !state.you.seen) bindFlip();
    if (!showLandscape) renderChatPanel(); // في العرض العريض الشات ظاهر جوه العمود مش عايم
    renderFarewellModal();
    renderTieModal();
    if (!state || state.phase !== "tally") voteStatIdx = null;
    renderVoteStat();
    renderUndoButton();
    renderNightTask();
    updateSfx();
    renderMoreButton();
    renderMoreMenu();
    if (showLandscape) restoreInlineChatInput(lPrevValue, lWasFocused);
  } catch (e) { /* الصفحة يمكن اتقفلت أو في تحديث متأخر وصل بعدها — نتجاهله بأمان */ }
}
/* ------------------------- مهمة الليل (تشغيل اللي مستنيين) -------------------------
 * المشكلة: إحنا بنلعب قاعدين جنب بعض. لما ييجي الليل، اللي معندهمش دور
 * بيقعدوا فاضيين فيبصّوا على اللي بيدوس على موبايله ويعرفوا مين الحرامي أو
 * الضابط أو الدكتور. الحل: كل واحد مستني بياخد مهمة سريعة على موبايله،
 * فالكل بيبقى مركّز في شاشته ومحدش فاضي يراقب. المهمة محلية بالكامل —
 * مبتأثرش على اللعبة ولا بتتبعت للسيرفر، وبتتغيّر كل ليلة.
 */
var nightTask = null; // { day, step, kind, score, timers[] }

function nightTaskShouldShow() {
  return !!(state && state.phase === "night" && !state.myTurn && state.you && state.you.alive);
}

function clearNightTask() {
  if (nightTask && nightTask.timers) nightTask.timers.forEach(function (t) { clearInterval(t); clearTimeout(t); });
  nightTask = null;
  var el = document.getElementById("nightTask");
  if (el) el.remove();
}

/** شريط الحالة فوق المهمة: بيقول المرحلة دلوقتي على مين وبتعمل إيه ومين خلص —
 *  من غير أي أسامي، عشان محدش يعرف مين اللي بيلعب الدور ده. */
function updateNightStatus() {
  var box = document.getElementById("ntStatus");
  if (!box || !state || !state.nightProgress) return;
  var np = state.nightProgress;
  var info = {
    thieves: { name: "دور الحرامية", what: "بيختاروا مين يضربوه الليلة", color: "var(--madder)", icon: "🥷" },
    cop:     { name: "دور الضابط",   what: "بيكشف عن هوية واحد من اللي في الدور", color: "var(--indigo2)", icon: "🔎" },
    doctor:  { name: "دور الدكتور",  what: "بيختار مين يعالجه ويحميه", color: "var(--teal)", icon: "🩺" },
    rami:    { name: "دور الرصاصة الأخيرة", what: "ممكن يستخدم رصاصته أو يسيبها", color: "#4A7FD9", icon: "🎯" },
  }[np.step] || { name: "الليل", what: "الدور بيمشي", color: "var(--muted)", icon: "🌙" };

  var prog = np.step === "thieves" && np.actors > 1
    ? "خلص " + ar(np.done) + " من " + ar(np.actors)
    : (np.done >= np.actors ? "خلص" : "لسه بيختار…");

  // نقط بتوضّح إحنا في أنهي مرحلة من مراحل الليل
  var dots = "";
  for (var i = 1; i <= np.steps; i++) {
    dots += '<span style="width:7px;height:7px;border-radius:50%;background:' +
      (i < np.stepNo ? "var(--saffron)" : i === np.stepNo ? "var(--parch)" : "rgba(255,255,255,.18)") + '"></span>';
  }

  box.innerHTML = '<div style="border:1px solid ' + info.color + '55;background:' + info.color +
    '18;border-radius:14px;padding:11px 13px">' +
    '<div style="display:flex;align-items:center;gap:9px">' +
    '<span style="font-size:20px">' + info.icon + "</span>" +
    '<div style="flex:1;min-width:0">' +
    '<div style="font-family:var(--disp);font-size:17px;color:var(--parch);line-height:1.2">' + info.name + "</div>" +
    '<div style="font-size:12px;color:var(--muted);margin-top:2px">' + info.what + "</div></div>" +
    '<div style="font-size:11.5px;font-weight:800;color:' + info.color + ';white-space:nowrap">' + prog + "</div></div>" +
    '<div style="display:flex;align-items:center;gap:5px;margin-top:9px">' + dots +
    '<span style="font-size:10.5px;color:var(--faint);margin-inline-start:6px">مرحلة ' + ar(np.stepNo) + " من " + ar(np.steps) + "</span></div></div>";
}

function renderNightTask() {
  if (!nightTaskShouldShow()) { clearNightTask(); return; }
  var host = document.getElementById("nightTask");
  // لو المهمة شغّالة بالفعل لنفس اللحظة، سيبها زي ما هي (مترجعش من الأول كل تحديث)
  if (host && nightTask && nightTask.day === state.day && nightTask.step === state.nightStep) { updateNightStatus(); return; }
  clearNightTask();

  var kinds = ["coins", "odd", "order"];
  var kind = kinds[Math.abs(state.day + String(state.nightStep || "").length) % kinds.length];
  nightTask = { day: state.day, step: state.nightStep, kind: kind, score: 0, timers: [] };

  host = document.createElement("div");
  host.id = "nightTask";
  host.style.cssText = "position:fixed;inset:0;z-index:160;background:linear-gradient(170deg,#171232,#0E0B20);" +
    "display:flex;flex-direction:column;padding:16px;overflow:hidden";
  document.body.appendChild(host);

  var titles = { coins: "اجمع الفلوس", odd: "هات المختلف", order: "بالترتيب" };
  var hints = {
    coins: "دوس على 💰 بس — وخد بالك من 💣",
    odd: "دوس على الرمز المختلف عن الباقي",
    order: "دوس على الأرقام بالترتيب من ١",
  };
  host.innerHTML =
    '<div id="ntStatus" style="flex:none"></div>' +
    '<div style="display:flex;align-items:center;justify-content:space-between;flex:none;margin-top:10px">' +
    '<div><div style="font-family:var(--body);font-weight:800;font-size:12px;color:var(--saffron);letter-spacing:1px">مهمة الليل</div>' +
    '<div style="font-family:var(--disp);font-size:21px;color:var(--parch)">' + titles[kind] + "</div></div>" +
    '<div style="text-align:center"><div style="font-size:11px;color:var(--muted);font-weight:700">نقاطك</div>' +
    '<div id="ntScore" style="font-family:var(--disp);font-size:26px;color:var(--saffron)">٠</div></div></div>' +
    '<div style="font-size:12.5px;color:var(--muted);margin:6px 0 10px;flex:none">' + hints[kind] + "</div>" +
    '<div id="ntArea" style="position:relative;flex:1;border:1px solid rgba(255,255,255,.08);border-radius:16px;' +
    'background:rgba(255,255,255,.02);overflow:hidden"></div>' +
    '<div style="font-size:11.5px;color:var(--faint);text-align:center;margin-top:10px;flex:none">' +
    "الليل بيمشي لوحده — أول ما الكل يخلص، هنشوف النتيجة 🌙</div>";
  updateNightStatus();

  var area = host.querySelector("#ntArea");
  var scoreEl = host.querySelector("#ntScore");
  function addScore(n) {
    if (!nightTask) return;
    nightTask.score = Math.max(0, nightTask.score + n);
    if (scoreEl) scoreEl.textContent = ar(nightTask.score);
  }

  if (kind === "coins") startCoinsTask(area, addScore);
  else if (kind === "odd") startOddTask(area, addScore);
  else startOrderTask(area, addScore);
}

/** لعبة ١: رموز بتظهر عشوائي — دوس على الفلوس وابعد عن القنابل */
function startCoinsTask(area, addScore) {
  var spawn = setInterval(function () {
    if (!area.isConnected) return;
    var good = Math.random() > 0.32;
    var el = document.createElement("button");
    el.textContent = good ? "💰" : "💣";
    var size = 46;
    el.style.cssText = "position:absolute;border:0;background:none;font-size:32px;cursor:pointer;padding:0;" +
      "width:" + size + "px;height:" + size + "px;transition:transform .12s,opacity .12s;" +
      "left:" + Math.random() * Math.max(1, area.clientWidth - size) + "px;" +
      "top:" + Math.random() * Math.max(1, area.clientHeight - size) + "px";
    el.onclick = function () {
      buzz(10);
      addScore(good ? 1 : -1);
      el.style.transform = "scale(1.6)";
      el.style.opacity = "0";
      setTimeout(function () { el.remove(); }, 120);
    };
    area.appendChild(el);
    setTimeout(function () { el.remove(); }, 1400);
  }, 620);

/** لعبة ٢: شبكة رموز متشابهة وواحد مختلف */
function startOddTask(area, addScore) {
  var sets = [["🙂", "🙃"], ["🐱", "🐺"], ["🍉", "🍅"], ["⭐", "✨"], ["🔵", "🟣"], ["🗝️", "🔑"]];
  function round() {
    if (!area.isConnected) return;
    var pair = sets[Math.floor(Math.random() * sets.length)];
    var n = 12, odd = Math.floor(Math.random() * n);
    var html = '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px;height:100%;box-sizing:border-box">';
    for (var i = 0; i < n; i++) {
      html += '<button data-odd="' + (i === odd ? "1" : "0") + '" style="border:1px solid rgba(255,255,255,.07);' +
        "background:rgba(255,255,255,.03);border-radius:12px;font-size:26px;cursor:pointer;padding:0\">" +
        (i === odd ? pair[1] : pair[0]) + "</button>";
    }
    area.innerHTML = html + "</div>";
    Array.prototype.forEach.call(area.querySelectorAll("button"), function (b) {
      b.onclick = function () {
        buzz(10);
        if (b.getAttribute("data-odd") === "1") { addScore(1); round(); }
        else { addScore(-1); b.style.opacity = ".25"; }
      };
    });
  }
  round();
}

/** لعبة ٣: دوس على الأرقام بالترتيب */
function startOrderTask(area, addScore) {
  function round() {
    if (!area.isConnected) return;
    var order = [];
    for (var i = 1; i <= 9; i++) order.push(i);
    for (var j = order.length - 1; j > 0; j--) { var k = Math.floor(Math.random() * (j + 1)); var t = order[j]; order[j] = order[k]; order[k] = t; }
    var next = 1;
    var html = '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:10px;height:100%;box-sizing:border-box">';
    order.forEach(function (v) {
      html += '<button data-v="' + v + '" style="border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.03);' +
        "border-radius:12px;font-family:var(--disp);font-size:23px;color:var(--parch);cursor:pointer\">" + ar(v) + "</button>";
    });
    area.innerHTML = html + "</div>";
    Array.prototype.forEach.call(area.querySelectorAll("button"), function (b) {
      b.onclick = function () {
        buzz(10);
        if (Number(b.getAttribute("data-v")) === next) {
          b.style.background = "rgba(233,163,60,.25)";
          b.style.color = "var(--saffron)";
          b.disabled = true;
          next++;
          if (next > 9) { addScore(3); round(); }
        } else { addScore(-1); }
      };
    });
  }
  round();
}

    (async function () {

          var all = await indexedDB.databases();

        }
      } catch (e) {}
      await Promise.all(names.map(function (n) {
        return new Promise(function (res) {
          try {
            var r = indexedDB.deleteDatabase(n);
            r.onsuccess = r.onerror = r.onblocked = function () { res(); };
            setTimeout(res, 1200);
          } catch (e) { res(); }
        });
      }));
      try { localStorage.clear(); } catch (e) {}
      try { sessionStorage.clear(); } catch (e) {}
      try { if (window.caches && caches.keys) { var ks = await caches.keys(); await Promise.all(ks.map(function (c) { return caches.delete(c); })); } } catch (e) {}
      location.reload();
    })();
    return;
  }
  if (k === "rerender") { render(); return; }
  if (k === "create") { doCreate(); return; }
  if (k === "join") { doJoin(); return; }
  if (k === "resume") { doResume(); return; }
  if (k === "leave") { doLeave(); return; }

    if (wasHostRetry) { doCreate(); }

    else { render(); }
    return;
  }
  if (k === "about") { uiSheet = { t: "about" }; render(); return; }

  if (!client) return;

  if (k === "th") {
    var maxTh = Math.max(1, Math.floor((state.players.length - 1) / 2));
    var nv = Math.max(1, Math.min(maxTh, state.cfg.thieves + Number(parts[1])));

    var nvw = Math.max(1, Math.min(vwMx, (state.cfg.villagersToWin || 1) + Number(parts[1])));

    client.send({ t: "cfg", cfg: Object.assign({}, state.cfg, { doctorHealCount: ndh }) });

  if (k === "tg") {
    var key = parts[1], patch = {}; patch[key] = !state.cfg[key];
    if (key === "cop" && patch.cop) patch.nightKill = true;
    client.send({ t: "cfg", cfg: Object.assign({}, state.cfg, patch) });

  if (k === "toggleRoomChat") { client.send({ t: "setChatEnabled", value: !state.chatEnabled }); return; }
  if (k === "dtimer") { dayTimerChoice = Math.max(30, Math.min(120, dayTimerChoice + Number(parts[1]))); render(); return; }
  if (k === "startTimer") { client.send({ t: "startTimer", seconds: dayTimerChoice }); return; }
  if (k === "start") { client.send({ t: "start" }); return; }
  if (k === "seen") { client.send({ t: "seen" }); return; }
  if (k === "next") { client.send({ t: "next" }); return; }
  if (k === "voteStat") { voteStatIdx = Number(parts[1]); renderVoteStat(); return; }
  if (k === "votePick") {
    var vid = Number(parts[1]);
    var pos = voteSel.indexOf(vid);
    if (pos === -1) voteSel.push(vid); else voteSel.splice(pos, 1);
    render();
    return;
  }
  if (k === "voteClear") { voteSel = []; render(); return; }
  if (k === "voteConfirm") { client.send({ t: "vote", targets: voteSel.slice() }); return; }
  if (k === "forceVote") { client.send({ t: "forceVote" }); return; }
  if (k === "tallyNext") { client.send({ t: "tallyNext" }); return; }
  if (k === "revote") { client.send({ t: "revote" }); return; }
  if (k === "runoff") { client.send({ t: "runoff" }); return; }
  if (k === "fwPick") { farewellTarget = Number(parts[1]); render(); return; }
  if (k === "fwCancel") { farewellTarget = null; render(); return; }
  if (k === "fwSend") {
    var fwInp = document.getElementById("fwText");

    client.send({ t: "farewell", to: farewellTarget, text: fwInp.value.trim() });
    farewellTarget = null;
    render();
    return;
  }
  if (k === "heal") { client.send({ t: "night", heal: parts[1] === "1" }); return; }
  if (k === "npick") {
    var pid = Number(parts[1]);
    var multi = state.nightStep === "doctor" ? state.doctorHeals : 1;
    if (multi === 1) nightPicks = [pid];
    else {

    else client.send({ t: "night", targets: nightPicks.slice() });

var toasts = [];
function showToast(msg) {
  var id = Math.random().toString(36).slice(2);
  toasts.push({ id: id, msg: String(msg).slice(0, 220) });
  renderToasts();
  setTimeout(function () { toasts = toasts.filter(function (t) { return t.id !== id; }); renderToasts(); }, 9000);
}
function renderToasts() {
  var host = document.getElementById("toasts");
  if (!host) { host = document.createElement("div"); host.id = "toasts"; host.style.cssText = "position:fixed;top:8px;left:8px;right:8px;z-index:200;display:flex;flex-direction:column;gap:6px;pointer-events:none"; document.body.appendChild(host); }
  host.innerHTML = toasts.map(function (t) {
    return '<div style="background:linear-gradient(180deg,#E85C55,#B93A34);color:#fff;padding:10px 14px;border-radius:12px;font-family:Tajawal,sans-serif;font-size:12.5px;line-height:1.6;box-shadow:0 8px 20px rgba(0,0,0,.4);pointer-events:auto">⚠️ ' + t.msg.replace(/</g, "&lt;") + "</div>";
  }).join("");
}
window.addEventListener("unhandledrejection", function (e) {
  var m = (e.reason && (e.reason.code || e.reason.message)) || String(e.reason);
  var stack = e.reason && e.reason.stack ? " | " + e.reason.stack.split("\n").slice(0, 3).join(" » ") : "";
  showToast("خطأ غير متوقع: " + m);
  if (window.__firebaseDebugLog) window.__firebaseDebugLog.push(new Date().toTimeString().slice(0, 8) + " — !! رفض غير متوقع: " + m + stack);
});
window.addEventListener("error", function (e) {
  if (e.message) {
    var loc = e.filename ? (" [سطر " + e.lineno + ":" + e.colno + "]") : "";
    var stack = e.error && e.error.stack ? " | " + e.error.stack.split("\n").slice(0, 3).join(" » ") : "";
    if (window.__firebaseDebugLog) window.__firebaseDebugLog.push(new Date().toTimeString().slice(0, 8) + " — !! خطأ صفحة: " + e.message + loc + stack);
    showToast("خطأ في الصفحة: " + e.message + loc);
  }
});

(function () {
  var b = document.createElement("div");
  b.innerHTML = debugToggleHTML();
  document.body.appendChild(b.firstChild);

  var chatHost = document.createElement("div");
  chatHost.id = "chattogglehost";
  chatHost.innerHTML = moreMenuToggleHTML();
  document.body.appendChild(chatHost);
})();

render(); // نعرض "بنتوصّل…" فورًا — من غيرها الشاشة كانت تفضل فاضية تمامًا لحد ما فايربيز يرد
boot();
</script>
