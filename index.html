/*

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#16122A;--ink2:#221C3D;--ink3:#2C2450;--line:#3B3168;
  --parch:#F3E9D6;--muted:#A398C7;--faint:#6F639A;
  --saffron:#E9A33C;--madder:#D1483F;--teal:#3EA08D;--violet:#9B6BD6;
  --disp:'Lalezar','Tajawal','Noto Kufi Arabic',system-ui,sans-serif;
  --logo:'Rakkas','Lalezar','Noto Kufi Arabic',serif;
  --body:'Tajawal','Noto Kufi Arabic',system-ui,sans-serif;
}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{
  background:var(--ink);color:var(--parch);font-family:var(--body);
  -webkit-user-select:none;user-select:none;
  background-image:
    radial-gradient(ellipse 130% 55% at 50% -12%,rgba(233,163,60,.2),rgba(22,18,42,0) 65%),
    radial-gradient(ellipse 100% 45% at 50% 112%,rgba(90,60,160,.14),rgba(22,18,42,0) 60%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='56'><g fill='none' stroke='%23F3E9D6' stroke-opacity='.055'><rect x='14' y='14' width='28' height='28'/><rect x='14' y='14' width='28' height='28' transform='rotate(45 28 28)'/><circle cx='28' cy='28' r='3.5'/></g></svg>");
  background-attachment:fixed;
}
#app{max-width:460px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 18px calc(env(safe-area-inset-bottom) + 20px);
  min-height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:6px 0 4px}
.grow{flex:1}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px 0}
.ctr{text-align:center}
.ico{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);
  color:var(--parch);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px}
.ico:active{transform:scale(.94)}
.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 12px;white-space:nowrap}
.logo{font-family:var(--logo);font-size:44px;line-height:1.25;text-align:center;margin:0}
.logo .g{color:var(--saffron)}
h1.t{font-family:var(--disp);font-size:30px;line-height:1.4;margin:0 0 6px;font-weight:400}
h2.t{font-family:var(--disp);font-size:21px;line-height:1.5;margin:0 0 4px;font-weight:400}
p.d{font-size:15px;line-height:1.75;color:var(--muted);margin:0}
.eb{font-size:12.5px;font-weight:700;letter-spacing:2px;color:var(--saffron);margin:0 0 10px}
.fine{font-size:11.5px;color:var(--faint);line-height:1.9;text-align:center}
.btn{width:100%;border:none;border-radius:16px;padding:17px 18px;font-family:var(--disp);font-size:19px;
  letter-spacing:.4px;background:linear-gradient(180deg,#F5BC66,#DE9226);color:#221602;cursor:pointer;
  display:block;text-align:center;transition:transform .1s,box-shadow .1s;
  box-shadow:0 5px 0 #8E5E14,0 10px 20px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8E5E14,0 5px 10px rgba(0,0,0,.3)}
.btn:disabled{opacity:.32}
.btn.ghost{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01));
  border:1px solid var(--line);color:var(--parch);box-shadow:0 3px 8px rgba(0,0,0,.3)}
.btn.ghost:active{transform:translateY(1px)}
.btn.dark{background:linear-gradient(180deg,#2A2350,#1D1839);border:1px solid var(--line);color:var(--parch);
  box-shadow:0 4px 0 #120E26,0 8px 16px rgba(0,0,0,.35)}
.btn.dark:active{transform:translateY(2px);box-shadow:0 2px 0 #120E26,0 4px 8px rgba(0,0,0,.3)}
.btn.violet{background:linear-gradient(180deg,#B287E8,#8656C4);color:#180B2B;
  box-shadow:0 5px 0 #4A2A78,0 10px 20px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.violet:active{transform:translateY(3px);box-shadow:0 2px 0 #4A2A78}
.btn.sm{padding:12px 14px;font-size:16px;border-radius:13px}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:linear-gradient(180deg,#262046,#1E1938);border:1px solid rgba(255,255,255,.07);
  border-radius:20px;padding:16px;box-shadow:0 8px 22px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.05)}
.soft{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));
  border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:14px 16px;
  box-shadow:0 5px 14px rgba(0,0,0,.3)}
.row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.num{width:34px;height:34px;flex:none;border-radius:10px;background:var(--ink3);display:flex;align-items:center;
  justify-content:center;font-weight:800;font-size:14px;color:var(--saffron)}
input{flex:1;background:var(--ink2);border:1px solid var(--line);border-radius:13px;padding:13px 14px;
  color:var(--parch);font-family:var(--body);font-size:16px;outline:none;min-width:0;-webkit-user-select:text;user-select:text}
input:focus{border-color:var(--saffron)}
input::placeholder{color:#6B5F92}
.step{display:flex;align-items:center;gap:10px}
.step button{width:42px;height:42px;flex:none;border-radius:13px;border:1px solid rgba(255,255,255,.08);
  background:linear-gradient(180deg,#2A2350,#1E1939);color:var(--parch);font-size:22px;line-height:1;cursor:pointer;
  box-shadow:0 3px 0 #131028,0 5px 10px rgba(0,0,0,.3)}
.step button:active{transform:translateY(2px);box-shadow:0 1px 0 #131028}
.step button:active{transform:scale(.92)}
.step .v{font-family:var(--disp);font-size:26px;min-width:40px;text-align:center}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;cursor:pointer}
.sw+.sw{border-top:1px solid var(--line)}
.swl{display:flex;gap:10px;align-items:center;min-width:0}
.swt{font-weight:800;font-size:16px}
.sws{font-size:13px;color:var(--muted);line-height:1.5}
.knob{width:52px;height:30px;flex:none;border-radius:999px;background:linear-gradient(180deg,#241E44,#2E2754);
  border:1px solid var(--line);position:relative;transition:.2s;box-shadow:inset 0 2px 5px rgba(0,0,0,.4)}
.knob i{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:linear-gradient(180deg,#C4B9E4,#9A8DC2);transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.knob.on{background:rgba(233,163,60,.22);border-color:var(--saffron)}
.knob.on i{right:calc(100% - 25px);background:linear-gradient(180deg,#F5C976,#E09A2E);box-shadow:0 2px 6px rgba(233,163,60,.5)}
.flip{perspective:1200px;height:min(82dvh,420px);aspect-ratio:3/3.7;width:auto;max-width:100%;margin:0 auto;touch-action:none;
  -webkit-touch-callout:none;cursor:pointer;container-type:size}
.flipin{position:relative;width:100%;height:100%;transition:transform .42s cubic-bezier(.4,.9,.3,1.15);transform-style:preserve-3d}
.flip.open .flipin{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(6px,3.5%,16px);text-align:center;overflow:hidden}
.face.bk{box-shadow:0 18px 40px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.3),inset 0 -14px 30px rgba(0,0,0,.18)}
.face.bk::before{content:"";position:absolute;inset:0;border-radius:24px;pointer-events:none;
  background:linear-gradient(165deg,rgba(255,255,255,.22),rgba(255,255,255,0) 40%,rgba(0,0,0,.1))}
.face.bk{transform:rotateY(180deg)}
.cover{background:linear-gradient(160deg,#2E2758,#191430);border:1px solid rgba(255,255,255,.09);
  box-shadow:0 18px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.09)}
.hint{position:absolute;bottom:18px;font-size:13.5px;color:var(--muted);font-weight:500}
.rn{font-family:var(--disp);font-size:20px;font-size:clamp(13px,8cqmin,34px);line-height:1.15;margin:3px 0 2px;flex:none}
.rd{font-size:10px;font-size:clamp(8.5px,3cqmin,13.5px);line-height:1.28;opacity:.85;max-width:97%;flex:none}
.pt{margin-top:3px;font-size:9px;font-size:clamp(8px,2.5cqmin,13px);font-weight:800;border-top:1px dashed rgba(0,0,0,.3);padding-top:3px;flex:none;max-width:97%}
.ms{margin-top:3px;border-top:1px dashed rgba(0,0,0,.32);padding-top:3px;max-width:97%;flex:none}
.ms b{display:block;font-size:7.5px;font-size:clamp(7px,2.2cqmin,11.5px);letter-spacing:1px;opacity:.6;margin-bottom:2px}
.ms span{font-size:10px;font-size:clamp(9px,3cqmin,14.5px);font-weight:800;line-height:1.28}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.pick{border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,#2A2350,#1E1939);
  border-radius:15px;padding:15px 8px;font-family:var(--body);font-size:16px;font-weight:700;color:var(--parch);
  cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  box-shadow:0 4px 0 #131028,0 7px 14px rgba(0,0,0,.3)}
.pick:active{transform:translateY(2px);box-shadow:0 2px 0 #131028}
.pick.sel{border-color:var(--saffron);background:linear-gradient(180deg,rgba(233,163,60,.28),rgba(233,163,60,.1));
  color:var(--saffron);box-shadow:0 4px 0 #6E4A12,0 8px 18px rgba(233,163,60,.25)}
.pick{position:relative}
.vcount{position:absolute;top:5px;inset-inline-end:6px;min-width:20px;height:20px;line-height:20px;
  border-radius:10px;background:var(--madder);color:#fff;font-size:12px;font-weight:800;padding:0 5px}
.vcount.zero{background:rgba(255,255,255,.12);color:var(--muted)}
.vr{display:flex;align-items:center;gap:9px;background:linear-gradient(180deg,#262046,#1E1938);
  border:1px solid rgba(255,255,255,.06);border-radius:15px;padding:9px 12px;margin-bottom:8px;
  box-shadow:0 4px 10px rgba(0,0,0,.3)}
.vr .nm{flex:1;font-weight:700;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vr .c{font-family:var(--disp);font-size:22px;min-width:28px;text-align:center}
.vb{width:36px;height:36px;flex:none;border-radius:11px;border:1px solid rgba(255,255,255,.08);
  background:linear-gradient(180deg,#332B5E,#241E44);color:var(--parch);font-size:20px;line-height:1;cursor:pointer;
  box-shadow:0 3px 0 #15112C,0 5px 8px rgba(0,0,0,.3)}
.vb:active{transform:translateY(2px);box-shadow:0 1px 0 #15112C}
.vr.lead{border-color:var(--saffron);box-shadow:0 4px 14px rgba(233,163,60,.25),0 4px 10px rgba(0,0,0,.3)}
.bg{display:inline-flex;align-items:center;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:800;white-space:nowrap}
.lr{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.lr:last-child{border-bottom:none}
.lr.out .nm{text-decoration:line-through;opacity:.45}
.lr .nm{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(10,8,22,.74);display:flex;align-items:flex-end;justify-content:center}
.sheetin{width:100%;max-width:460px;background:linear-gradient(180deg,#2A2350,#1D1838);
  border:1px solid rgba(255,255,255,.09);border-bottom:none;
  border-radius:24px 24px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 26px);max-height:84vh;overflow-y:auto;
  animation:up .28s ease;box-shadow:0 -14px 40px rgba(0,0,0,.5)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.fade{animation:fd .3s ease}
@keyframes fd{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pulse{animation:pl 2.4s ease-in-out infinite}
@keyframes pl{0%,100%{opacity:.55}50%{opacity:1}}
.timer{font-family:var(--disp);font-size:62px;line-height:1;letter-spacing:2px}
.emos{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.emo{width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.08);
  background:linear-gradient(180deg,#2A2350,#1E1939);font-size:21px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #131028,0 5px 8px rgba(0,0,0,.3)}
.emo:active{transform:translateY(2px);box-shadow:0 1px 0 #131028}
.pop{position:fixed;bottom:130px;font-size:38px;z-index:45;pointer-events:none;animation:fl 1.7s ease-out forwards}
@keyframes fl{0%{opacity:0;transform:translateY(0) scale(.6)}18%{opacity:1;transform:translateY(-18px) scale(1.15)}
  100%{opacity:0;transform:translateY(-195px) scale(.95)}}
.foot{margin-top:16px;padding-top:12px;border-top:1px solid rgba(59,49,104,.55);text-align:center;
  font-size:11.5px;line-height:1.85;color:var(--faint)}
.foot a{color:var(--saffron);text-decoration:none;font-weight:700;
  -webkit-user-select:text;user-select:text;word-break:break-all}
.foot a:active{opacity:.6}
.foot .cr{display:block;color:var(--faint)}
.mt{margin-top:14px}.mt2{margin-top:24px}.mb{margin-bottom:14px}
.chip{display:inline-flex;font-family:var(--disp);font-size:28px;padding:8px 28px;border-radius:14px}
svg{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------------------------- إضافات نسخة الأونلاين ---------------------------- */
.netbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;
  background:linear-gradient(180deg,rgba(233,163,60,.16),rgba(233,163,60,.04));
  border:1px solid rgba(233,163,60,.3);border-radius:13px;padding:9px 12px;margin-bottom:10px;
  font-family:var(--body);font-size:12.5px;color:var(--saffron)}
.netbar.warn{background:linear-gradient(180deg,rgba(209,72,63,.2),rgba(209,72,63,.06));
  border-color:rgba(209,72,63,.4);color:#FF9C94}
.netbar .dot{width:8px;height:8px;border-radius:50%;background:var(--saffron);flex:none;
  box-shadow:0 0 8px var(--saffron);animation:pulse2 1.6s ease-in-out infinite}
.netbar.warn .dot{background:#E85C55;box-shadow:0 0 8px #E85C55}
@keyframes pulse2{0%,100%{opacity:1}50%{opacity:.35}}
.codebig{font-family:var(--disp);font-size:56px;letter-spacing:12px;color:var(--saffron);
  text-align:center;text-shadow:0 4px 20px rgba(233,163,60,.3)}
.codehint{text-align:center;font-family:var(--body);font-size:13px;color:var(--muted);margin-top:4px}
.resumeCard{background:linear-gradient(180deg,rgba(155,107,214,.16),rgba(155,107,214,.04));
  border:1px solid rgba(155,107,214,.35);border-radius:18px;padding:16px;margin-bottom:14px}
.plist{display:flex;flex-direction:column;gap:0}
.prow{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:none}
.prow .dotc{width:9px;height:9px;border-radius:50%;flex:none;background:var(--teal)}
.prow .dotc.off{background:var(--faint)}
.prow .nm{flex:1;font-family:var(--body);font-weight:700;font-size:15px;color:var(--parch)}
.prow .tg{font-size:11px;color:var(--muted)}
.errbox{background:linear-gradient(180deg,rgba(209,72,63,.18),rgba(209,72,63,.06));
  border:1px solid rgba(209,72,63,.4);border-radius:14px;padding:14px;margin-bottom:12px;
  font-family:var(--body);font-size:13.5px;line-height:1.8;color:#FFB3AC}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.12);
  border-top-color:var(--saffron);animation:spin2 .8s linear infinite;margin:0 auto}
@keyframes spin2{to{transform:rotate(360deg)}}
.qr{display:flex;justify-content:center;margin:14px 0}
.copybtn{display:flex;align-items:center;justify-content:center;gap:8px}
.badges{display:flex;flex-wrap:wrap;gap:7px}
.row2{display:flex;gap:9px}
.row2 .btn{flex:1}
.tapfx{filter:brightness(1.35) saturate(1.15) !important;transition:filter .05s ease}
.lwrap{display:flex;gap:10px;max-width:900px;margin:10px auto;align-items:stretch;padding:0 6px}
#app.lon{max-width:none}
.lside{flex:0 0 160px;background:rgba(20,16,38,.6);border:1px solid rgba(255,255,255,.08);
  border-radius:14px;display:flex;flex-direction:column;max-height:min(78vh,640px);overflow:hidden}
.lmid{flex:1;min-width:0;max-width:400px;margin:0 auto}
.lside .lhead{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.08);font-family:var(--body);
  font-weight:800;font-size:12px;color:var(--saffron);flex:none}
.lside .lbody{flex:1;overflow-y:auto;padding:10px 11px;min-height:60px}
.lside .lfoot{flex:none;padding:9px;border-top:1px solid rgba(255,255,255,.08)}
.logrow{padding:8px 0;border-bottom:1px solid rgba(255,255,255,.06);font-size:11.5px;line-height:1.65;color:var(--parch)}
.logrow .lday{color:var(--muted);font-size:10px;display:block;margin-bottom:2px}
@media (max-width:640px){ .lwrap{flex-direction:column;max-width:400px} .lside{max-height:210px;flex:none} }

</style>

  traitor:  { key: "traitor",  label: "خاين",     team: "solo",    color: "#9B6BD6", ink: "#180B2B" },
  rami:     { key: "rami",     label: "الرصاصة الأخيرة",   team: "village", color: "#4A7FD9", ink: "#0B1C33" },
};

const ROLE_DESC = {
  villager: "مالكش قدرة خاصة. سلاحك كلامك — اكشف الحرامية قبل ما يخلّصوا عليكم.",
  thief: "بالليل بتتفق مع شركاك على ضحية. بالنهار مثّل إنك واحد منهم.",
  doctor: "كل ليلة بتنقذ حد — من غير ما تعرف مين اللي اتضرب.",
  cop: "كل ليلة بتضرب واحد بتشك فيه. لو غلطت، تبقى خسّرت بريء.",
  traitor: "مالكش صف. عندك مهمة سرية لازم تعملها — محدش يعرفك، ولو فشلت هتتفضح.",
  rami: "إنت من أهل القرية ومعاك رصاصة واحدة بس طول اللعبة. بالليل تقدر تضرب حد بيها: لو طلع حرامي، يطلع فورًا. لو طلع من أهل القرية، إنت اللي تطلع بدله. مفيش هوية بتتكشف إلا لما حد يطلع — فاستخدمها بحساب.",
};

const DEFAULT_CFG = {
  thieves: 1, doctor: false, cop: false, traitor: false, nightKill: false, rami: false, doctorHealCount: 1,
  lastMessage: true, villagersToWin: 2, villagersToTie: 1,
  talkSeconds: 120, voteSeconds: 60, talkRounds: 2,
};

function suggestCfg(n) {
  const base = { talkSeconds: 120, voteSeconds: 60, talkRounds: 2, lastMessage: true };
  if (n <= 5) return { ...base, thieves: 1, doctor: false, cop: false, traitor: false, nightKill: false, villagersToWin: 2 };
  if (n <= 7) return { ...base, thieves: 2, doctor: true, cop: false, traitor: false, nightKill: false, villagersToWin: 2 };
  if (n <= 8) return { ...base, thieves: 2, doctor: true, cop: true, traitor: false, nightKill: true, villagersToWin: 3 };
  if (n <= 11) return { ...base, thieves: 2, doctor: true, cop: true, traitor: true, nightKill: true, villagersToWin: 3 };
  return { ...base, thieves: 3, doctor: true, cop: true, traitor: true, nightKill: true, villagersToWin: 4 };
}

function validateCfg(cfg, n) {
  const maxTh = Math.max(1, Math.floor((n - 1) / 2));
  if (n < 3) return "لازم ٣ لاعبين على الأقل.";
  if (n > 15) return "أقصى عدد ١٥ لاعب.";
  if (cfg.thieves < 1 || cfg.thieves > maxTh) return `عدد الحرامية لازم يكون من ١ لـ ${maxTh}.`;
  const taken = cfg.thieves + (cfg.doctor ? 1 : 0) + (cfg.cop ? 1 : 0) + (cfg.traitor ? 1 : 0) + (cfg.rami ? 1 : 0);
  if (n - taken < 1) return "لازم يفضل واحد على الأقل من أهل القرية.";
  return null;
}

/* ------------------------------ مهام الخاين ------------------------------ */
const MISSIONS = [
  { id: "outFirstVote", hard: "متوسطة", t: () => "تطلع برّا الدور بالتصويت في اليوم الأول.",
    check: (c) => (c.myOut && c.myOut.day === 1 && c.myOut.by === "vote") ? "win" : (c.day >= 1 ? "fail" : "wait") },

  { id: "firstOut", hard: "صعبة", t: () => "تكون أول واحد يطلع برّا الدور في اللعبة كلها.",
    check: (c) => { const f = c.log.outs[0]; if (f) return f.id === c.meId ? "win" : "fail"; return c.ended ? "fail" : "wait"; } },

  { id: "surviveAll", hard: "صعبة", t: () => "تفضل عايش لحد ما اللعبة تخلص، متطلعش خالص.",
    check: (c) => c.myOut ? "fail" : (c.ended ? "win" : "wait") },

  { id: "thievesWin", hard: "صعبة", t: () => "خلّي الحرامية يكسبوا اللعبة.",
    check: (c) => c.ended ? (c.result === "thieves" ? "win" : "fail") : "wait" },

  { id: "villageWin", hard: "متوسطة", t: () => "خلّي أهل القرية يكسبوا اللعبة.",
    check: (c) => c.ended ? (c.result === "village" ? "win" : "fail") : "wait" },

  { id: "thiefOutDay1", hard: "متوسطة", t: () => "خلّي حرامي واحد على الأقل يطلع من اليوم الأول.",
    check: (c) => c.log.outs.some((o) => o.day === 1 && c.roleOf(o.id) === "thief") ? "win" : (c.day >= 1 ? "fail" : "wait") },

  { id: "innocentOutDay1", hard: "سهلة", t: () => "خلّي واحد بريء (مش حرامي) يطلع بالتصويت في اليوم الأول.",
    check: (c) => c.log.outs.some((o) => o.day === 1 && o.by === "vote" && c.roleOf(o.id) !== "thief") ? "win" : (c.day >= 1 ? "fail" : "wait") },

  { id: "targetOut", hard: "سهلة", needTarget: true, t: (nm) => `خلّي ${nm} يطلع برّا الدور قبل ما اللعبة تخلص.`,
    check: (c) => c.log.outs.some((o) => o.id === c.target) ? "win" : (c.ended ? "fail" : "wait") },

  { id: "targetSurvive", hard: "متوسطة", needTarget: true, t: (nm) => `احمي ${nm} — لازم يفضل عايش لآخر اللعبة.`,
    check: (c) => c.log.outs.some((o) => o.id === c.target) ? "fail" : (c.ended ? "win" : "wait") },

  { id: "reachDay4", hard: "سهلة", t: () => "خلّي اللعبة توصل لليوم الرابع.",
    check: (c) => (c.day >= 4 || (!c.ended && c.day >= 3)) ? "win" : (c.ended ? "fail" : "wait") },

  { id: "noVotesTwice", hard: "صعبة", t: () => "متاخدش ولا صوت واحد في أول تصويتين.",
    check: (c) => { const v = c.log.votes.slice(0, 2);
      if (v.some((x) => (x.counts[c.meId] || 0) > 0)) return "fail";
      return (v.length >= 2 || c.ended) ? "win" : "wait"; } },

  { id: "threeVotesSurvive", hard: "صعبة", t: () => "خد ٣ أصوات أو أكتر في تصويت واحد، وتفضل عايش لآخر اليوم ده.",
    check: (c) => c.log.votes.some((v) => (v.counts[c.meId] || 0) >= 3 &&
      !c.log.outs.some((o) => o.day === v.day && o.id === c.meId)) ? "win" : (c.ended ? "fail" : "wait") },

  { id: "dieByThieves", hard: "متوسطة", need: (g) => g.nightKill, t: () => "اتضرب من الحرامية بالليل — ده اللي لازم يخلّصك.",
    check: (c) => c.myOut ? (c.myOut.by === "thief" ? "win" : "fail") : (c.ended ? "fail" : "wait") },

  { id: "dieByCop", hard: "صعبة", need: (g) => g.cop, t: () => "خلّي الضابط يضربك أنت بالذات.",
    check: (c) => c.myOut ? (c.myOut.by === "cop" ? "win" : "fail") : (c.ended ? "fail" : "wait") },

  { id: "healedOnce", hard: "متوسطة", need: (g) => g.doctor, t: () => "خلّي الدكتور يعالجك أنت مرة واحدة على الأقل.",
    check: (c) => c.log.healed.some((h) => h.id === c.meId) ? "win" : (c.ended ? "fail" : "wait") },

  { id: "doctorOut", hard: "سهلة", need: (g) => g.doctor, t: () => "خلّي الدكتور يطلع برّا الدور.",
    check: (c) => c.log.outs.some((o) => c.roleOf(o.id) === "doctor") ? "win" : (c.ended ? "fail" : "wait") },

  { id: "copOut", hard: "متوسطة", need: (g) => g.cop, t: () => "خلّي الضابط يطلع برّا الدور.",

    check: (c) => { for (let d = 1; d <= c.day; d++) if (!c.log.outs.some((o) => o.day === d)) return "win";
      return c.ended ? "fail" : "wait"; } },

  { id: "survive3Days", hard: "متوسطة", t: () => "تعيش لحد اليوم التالت على الأقل.",
    check: (c) => { if (c.myOut && c.myOut.day < 3) return "fail"; if (!c.myOut && c.day >= 3) return "win";

  { id: "lastThree", hard: "صعبة", t: () => "تفضل واحد من آخر ٣ لاعبين في الدور.",
    check: (c) => { if (c.myOut) return "fail"; if (c.aliveCount <= 3) return "win"; return c.ended ? "fail" : "wait"; } },

  { id: "threeOutOneDay", hard: "صعبة", need: (g) => g.nightKill && g.cop, t: () => "خلّي تلاتة يطلعوا برّا في يوم واحد.",
    check: (c) => { for (let d = 1; d <= c.day; d++) if (c.log.outs.filter((o) => o.day === d).length >= 3) return "win";
      return c.ended ? "fail" : "wait"; } },

  { id: "noOneOutDay1", hard: "صعبة", need: (g) => !g.nightKill && !g.cop, t: () => "خلّي اليوم الأول يعدّي من غير ما يطلع حد خالص.",
    check: (c) => c.day >= 1 ? (c.log.outs.some((o) => o.day === 1) ? "fail" : "win") : "wait" },

  { id: "outByVote", hard: "متوسطة", t: () => "تطلع برّا بالتصويت — مش بضربة ليل.",
    check: (c) => c.myOut ? (c.myOut.by === "vote" ? "win" : "fail") : (c.ended ? "fail" : "wait") },

  { id: "thiefOutByVote", hard: "متوسطة", t: () => "خلّي حرامي يطلع برّا بالتصويت مش بأي طريقة تانية.",
    check: (c) => c.log.outs.some((o) => o.by === "vote" && c.roleOf(o.id) === "thief") ? "win" : (c.ended ? "fail" : "wait") },

  { id: "twoInnocentsOut", hard: "متوسطة", t: () => "خلّي اتنين أبرياء يطلعوا بالتصويت.",
    check: (c) => c.log.outs.filter((o) => o.by === "vote" && c.roleOf(o.id) !== "thief" && o.id !== c.meId).length >= 2
      ? "win" : (c.ended ? "fail" : "wait") },

  { id: "outlivedThief", hard: "سهلة", t: () => "تفضل عايش بعد ما أول حرامي يطلع برّا.",
    check: (c) => { const t = c.log.outs.find((o) => c.roleOf(o.id) === "thief");
      if (t) return c.myOut ? "fail" : "win";
      return (c.ended || c.myOut) ? "fail" : "wait"; } },
];

/* ------------------------------ أدوات ------------------------------ */
var now = () => Date.now(); // قابلة للاستبدال في الاختبارات
function rand(n) { return Math.floor(Math.random() * n); }

function shuffle(a, rnd = Math.random) {
  const x = a.slice();
  for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; }
  return x;
}

function makeCode(taken = {}) {
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let c;
  do { c = Array.from({ length: 4 }, () => A[rand(A.length)]).join(""); } while (taken[c]);
  return c;
}

const alivePlayers = (s) => s.players.filter((p) => p.alive);
/** زي alivePlayers بس بيستبعد الخاين بعد ما يتكشف — مالوش حق يصوّت ولا
 *  يُصوَّت عليه، بس بيفضل يشارك في الكلام عادي زي أهل القرية. */
const votingEligible = (s) => alivePlayers(s).filter((p) => !(s.missionShown && p.role === "traitor"));
const findPlayer = (s, id) => s.players.find((p) => p.id === id) || null;
const roleOf = (s, id) => { const p = findPlayer(s, id); return p ? p.role : null; };
const thievesAlive = (s) => alivePlayers(s).filter((p) => p.role === "thief");

/** حالة "التعادل": فاضل كام من أهل القرية عشان الحرامية يكسبوا، وهل وصلنا لحد التنبيه */
function tieState(s) {
  const totalNonThieves = s.players.filter((p) => p.role !== "thief").length;
  const goalRaw = Number(s.cfg.villagersToWin) || 0;
  if (goalRaw <= 0 || !totalNonThieves) return { reached: false, remaining: null, out: 0, goal: 0 };
  const goal = Math.min(goalRaw, totalNonThieves);
  const out = s.players.filter((p) => !p.alive && p.role !== "thief").length;
  const remaining = goal - out;
  const tieAt = Math.max(1, Math.min(5, Number(s.cfg.villagersToTie) || 1));
  // التنبيه بيشتغل لما نوصل لعدد الخارجين المحدد، وطول ما اللعبة لسه شغّالة
  return { reached: out >= tieAt && remaining > 0, remaining, out, goal };
}

function winner(s) {
  const alive = alivePlayers(s);
  const th = alive.filter((p) => p.role === "thief").length;
  if (th === 0) return "village";
  // كل اللي مش حرامي محسوب على أهل القرية (الخاين والدكتور والضابط والرصاصة الأخيرة وغيرهم)
  const totalNonThieves = s.players.filter((p) => p.role !== "thief").length;
  const goalRaw = Number(s.cfg.villagersToWin) || 0;
  if (goalRaw > 0) {
    const goal = Math.min(goalRaw, totalNonThieves); // مينفعش نطلب أكتر من العدد الموجود
    const outNonThieves = s.players.filter((p) => !p.alive && p.role !== "thief").length;
    return outNonThieves >= goal ? "thieves" : null;
  }
  // السلوك القديم لو الأوبشن مش مضبوط: الحرامية يكسبوا لما يوصلوا للتعادل في العدد
  if (th >= alive.length - th) return "thieves";
  return null;
}

function pickMission(cfg, players) {
  const pool = MISSIONS.filter((m) => !m.need || m.need(cfg));
  const m = pool[rand(pool.length)];
  const me = players.find((p) => p.role === "traitor");
  let target = null, tname = "";
  if (m.needTarget) {
    const others = players.filter((p) => !me || p.id !== me.id);
    const pick = others[rand(others.length)];
    target = pick.id; tname = pick.name;
  }
  return { id: m.id, hard: m.hard, target, text: m.t(tname) };
}

function evalMission(s) {
  if (!s.mission || s.missionStatus !== "wait") return s.missionStatus || "wait";
  const def = MISSIONS.find((m) => m.id === s.mission.id);
  if (!def) return "wait";
  const me = s.players.find((p) => p.role === "traitor");
  return def.check({
    meId: me ? me.id : null,
    target: s.mission.target,
    roleOf: (id) => roleOf(s, id),
    myOut: s.log.outs.find((o) => me && o.id === me.id) || null,
    log: s.log,
    day: s.day,
    ended: !!s.result,
    result: s.result,
    aliveCount: alivePlayers(s).length,
  });
}

/* ------------------------------ إنشاء اللعبة ------------------------------ */
function createRoom(code, hostId) {
  return {
    code,
    hostId,
    phase: "lobby",
    cfg: { ...DEFAULT_CFG },
    cfgTouched: false,
    players: [],
    day: 0,
    talkRound: 1,
    votes: {},
    nominated: null,
    night: null,
    events: [],
    eventIdx: 0,
    log: { outs: [], healed: [], votes: [] },
    mission: null,
    missionStatus: "wait",
    missionShown: false,
    chat: [],
    farewell: null, // {from, to, text} — سر بيقوله اللي طلع بالتصويت لحد واحد بس، قبل ما هويته تتكشف
    result: null,
    deadline: null,
    version: 0,
  };
}

/** بيظبّط الأدوار تلقائي حسب عدد اللاعبين، طول ما المضيف مغيّرش حاجة بإيده */
function autoCfg(s) {
  if (s.cfgTouched || s.phase !== "lobby") return s;
  const n = s.players.length;
  if (n < 5) return s;
  const sg = suggestCfg(n);
  s.cfg = { ...s.cfg, thieves: sg.thieves, doctor: sg.doctor, cop: sg.cop, traitor: sg.traitor, nightKill: sg.nightKill, villagersToWin: sg.villagersToWin };
  return s;
}

function addPlayer(s, { id, name, token }) {
  if (s.phase !== "lobby") throw new Error("اللعبة بدأت خلاص — مش هينفع حد يدخل دلوقتي.");
  if (s.players.length >= 15) throw new Error("الأوضة مليانة (١٥ لاعب).");
  const clean = String(name || "").trim().slice(0, 14) || `لاعب ${s.players.length + 1}`;
  if (s.players.some((p) => p.name === clean)) throw new Error("في حد بنفس الاسم — غيّره شوية.");
  s.players.push({ id, token, name: clean, role: null, alive: true, connected: true, seen: false });
  if (s.hostId === null || s.hostId === undefined) s.hostId = id;
  return s;
}

function removePlayer(s, id) {
  if (s.phase === "lobby") {
    s.players = s.players.filter((p) => p.id !== id);
    if (s.hostId === id && s.players[0]) s.hostId = s.players[0].id;
  } else {
    const p = findPlayer(s, id);
    if (p) p.connected = false;
  }
  return s;
}

function startGame(s) {
  const n = s.players.length;
  const err = validateCfg(s.cfg, n);
  if (err) throw new Error(err);

  const roles = [];
  for (let i = 0; i < s.cfg.thieves; i++) roles.push("thief");
  if (s.cfg.doctor) roles.push("doctor");
  if (s.cfg.cop) roles.push("cop");
  if (s.cfg.traitor) roles.push("traitor");
  if (s.cfg.rami) roles.push("rami");
  while (roles.length < n) roles.push("villager");

  const mixed = shuffle(roles);
  s.players.forEach((p, i) => { p.role = mixed[i]; p.alive = true; p.seen = false; p.ramiUsed = false; });

  s.mission = s.cfg.traitor ? pickMission(s.cfg, s.players) : null;
  s.missionStatus = "wait";
  s.missionShown = false;
  s.log = { outs: [], healed: [], votes: [] };
  s.day = 1; s.talkRound = 1; s.votes = {}; s.nominated = null; s.runoff = null; s._tied = null;
  s.night = null; s.events = []; s.eventIdx = 0; s.result = null;
  s.phase = "reveal";
  s.deadline = null;
  return s;
}

function markSeen(s, id) {
  const p = findPlayer(s, id);
  if (p) p.seen = true;
  if (s.phase === "reveal" && s.players.every((x) => x.seen)) beginDay(s);
  return s;
}

function beginDay(s) {
  s.phase = "day";
  s.talkRound = 1;
  s.votes = {};
  s.nominated = null;
  s.runoff = null; s._tied = null;
  s.deadline = null; // التايمر مقفول افتراضيًا — المضيف يشغّله يدويًا لو عايز
  return s;
}

function nextTalkRound(s) {
  if (s.talkRound < s.cfg.talkRounds) {
    s.talkRound += 1;
    s.deadline = null; // برضو مقفول للراوند الجديد
  } else beginVote(s);
  return s;
}

function beginVote(s) {
  s.phase = "vote";
  s.voteOutcome = null;
  s.votes = {};
  s.voteNonce = (s.voteNonce || 0) + 1;
  s.farewellSentThisRound = false;
  s.deadline = now() + s.cfg.voteSeconds * 1000;
  return s;
}

/** اللي ليهم حق يصوّتوا دلوقتي — في إعادة التعادل المتعادلين نفسهم مبيصوّتوش. */
function runoffVoters(s) {
  const excluded = (s.runoff && s.runoff.excludedVoters) || [];
  return votingEligible(s).filter((p) => !excluded.includes(p.id));
}

/** targets ممكن تكون لستة (تصويت على أكتر من واحد)، أو رقم، أو null (امتناع). */
function castVote(s, voterId, targets) {
  if (s.phase !== "vote") throw new Error("مش وقت تصويت دلوقتي.");
  const v = findPlayer(s, voterId);
  if (!v || !v.alive) throw new Error("اللي طلع برّا مبيصوّتش.");
  if (s.missionShown && v.role === "traitor") throw new Error("الخاين اتكشف، مبقاش ليه حق التصويت.");
  if (s.runoff && (s.runoff.excludedVoters || []).includes(voterId))
    throw new Error("اللي عليهم أعلى الأصوات في التعادل مبيصوّتوش في الإعادة.");
  const list = Array.isArray(targets) ? targets : (targets === null || targets === undefined ? [] : [targets]);
  const clean = [];
  list.forEach((raw) => {
    if (raw === null || raw === undefined) return;
    const tid = Number(raw);
    const t = findPlayer(s, tid);
    if (!t || !t.alive) throw new Error("اللاعب ده مش في الدور.");
    if (tid === voterId) throw new Error("مبتصوّتش على نفسك.");
    if (s.missionShown && t.role === "traitor") throw new Error("محدش يقدر يصوّت على الخاين بعد ما اتكشف.");
    if (s.runoff && !s.runoff.candidates.includes(tid)) throw new Error("في الإعادة بتصوّتوا بس على المتعادلين.");
    if (!clean.includes(tid)) clean.push(tid);
  });
  s.votes[voterId] = clean;
  const eligible = s.runoff ? runoffVoters(s) : votingEligible(s);
  const everyone = eligible.every((p) => p.id in s.votes);
  return { state: s, complete: everyone };
}

function voteCounts(s) {
  const counts = {};
  votingEligible(s).forEach((p) => (counts[p.id] = 0));
  Object.values(s.votes).forEach((arr) => {
    const list = Array.isArray(arr) ? arr : (arr === null || arr === undefined ? [] : [arr]);
    list.forEach((t) => { if (t !== null && t in counts) counts[t] += 1; });
  });
  return counts;
}

/** بيقفل التصويت. بيرجّع 'tie' | 'none' | 'ok' */
function closeVote(s) {
  const counts = voteCounts(s);
  let max = 0, best = [];
  Object.keys(counts).forEach((k) => {
    const id = Number(k);
    if (counts[id] > max) { max = counts[id]; best = [id]; }
    else if (counts[id] === max && max > 0) best.push(id);
  });
  s._counts = counts;
  s._rawVotes = { ...s.votes }; // نسخة من مين صوّت على مين — قبل ما votes يتصفّر للراوند الجاي
  if (max === 0) { s.nominated = null; s.voteOutcome = "none"; s.runoff = null; s._tied = null; return "none"; }
  if (best.length > 1) { s.nominated = null; s.voteOutcome = "tie"; s._tied = best.slice(); return "tie"; }
  s.nominated = best[0];
  s.voteOutcome = "ok";
  s.runoff = null; s._tied = null;
  return "ok";
}

/* ------------------------------ الليل ------------------------------ */
function nightOrder(s) {
  const order = [];
  if (s.cfg.nightKill && thievesAlive(s).length) order.push("thieves");
  if (s.cfg.cop && alivePlayers(s).some((p) => p.role === "cop")) order.push("cop");
  if (s.cfg.rami && alivePlayers(s).some((p) => p.role === "rami" && !p.ramiUsed)) order.push("rami");
  if (s.cfg.doctor && alivePlayers(s).some((p) => p.role === "doctor")) {
    const confirmOnly = !s.cfg.nightKill && !s.cfg.cop;
    if (!confirmOnly || s.nominated !== null) order.push("doctor");
  }
  return order;
}

const doctorHeals = (cfg) => Math.max(1, Math.min(3, Number(cfg.doctorHealCount) || 1));
const doctorConfirmMode = (cfg) => !cfg.nightKill && !cfg.cop;

function beginNight(s) {
  s.runoff = null; s._tied = null;
  const order = nightOrder(s);
  if (!order.length) return resolveMorning(s);
  s.phase = "night";
  s.night = { order, idx: 0, thief: null, cop: null, rami: null, healed: [], picks: {} };
  s.deadline = null;
  return s;
}

/** الحرامية بيصوّتوا بينهم؛ الضابط والدكتور بيختاروا لوحدهم. */
function nightAction(s, playerId, payload) {
  if (s.phase !== "night") throw new Error("مش وقت ليل دلوقتي.");
  const step = s.night.order[s.night.idx];
  const me = findPlayer(s, playerId);
  if (!me || !me.alive) throw new Error("اللي طلع برّا مش بيلعب بالليل.");

  if (step === "thieves") {
    if (me.role !== "thief") throw new Error("الدور مش عليك.");
    const t = findPlayer(s, payload.target);
    if (!t || !t.alive) throw new Error("اختار حد لسه في الدور.");
    if (t.role === "thief") throw new Error("الحرامية مايضربوش بعض.");
    s.night.picks[playerId] = payload.target;
    const all = thievesAlive(s).every((p) => p.id in s.night.picks);
    if (!all) return { state: s, advanced: false };
    const tally = {};
    Object.values(s.night.picks).forEach((id) => (tally[id] = (tally[id] || 0) + 1));
    let top = null, best = -1;
    Object.keys(tally).forEach((k) => { if (tally[k] > best) { best = tally[k]; top = Number(k); } });
    s.night.thief = top;
    s.night.picks = {};
    return { state: advanceNight(s), advanced: true };
  }

  if (step === "rami") {
    if (me.role !== "rami") throw new Error("الدور مش عليك.");
    if (payload.skip) return { state: advanceNight(s), advanced: true };
    const t = findPlayer(s, payload.target);
    if (!t || !t.alive || t.id === playerId) throw new Error("اختار حد تاني لسه في الدور.");
    s.night.rami = { by: playerId, target: payload.target, correct: t.role === "thief" };
    return { state: advanceNight(s), advanced: true };
  }

  if (step === "cop") {
    if (me.role !== "cop") throw new Error("الدور مش عليك.");
    const t = findPlayer(s, payload.target);
    if (!t || !t.alive || t.id === playerId) throw new Error("اختار حد تاني لسه في الدور.");
    s.night.cop = payload.target;
    return { state: advanceNight(s), advanced: true };
  }

  if (step === "doctor") {
    if (me.role !== "doctor") throw new Error("الدور مش عليك.");
    if (doctorConfirmMode(s.cfg)) {
      s.night.healed = payload.heal ? [s.nominated] : [];
    } else {
      const list = (payload.targets || []).slice(0, doctorHeals(s.cfg));
      if (!list.length) throw new Error("اختار واحد على الأقل.");
      if (list.some((id) => { const p = findPlayer(s, id); return !p || !p.alive; })) throw new Error("في حد اخترته مش في الدور.");
      s.night.healed = list;
    }
    return { state: advanceNight(s), advanced: true };
  }

  throw new Error("خطوة غير معروفة.");
}

function advanceNight(s) {
  s.night.idx += 1;
  if (s.night.idx >= s.night.order.length) return resolveMorning(s);
  return s;
}

/* ------------------------------ الصباح ------------------------------ */
function resolveMorning(s) {
  const n = s.night || { thief: null, cop: null, rami: null, healed: [] };
  const healed = n.healed || [];
  const ev = [];
  if (n.thief !== null && n.thief !== undefined) ev.push({ kind: "thief", target: n.thief, saved: healed.includes(n.thief) });
  if (n.cop !== null && n.cop !== undefined) ev.push({ kind: "cop", target: n.cop, saved: healed.includes(n.cop) });
  if (n.rami) {
    const ramiPlayer = findPlayer(s, n.rami.by);
    if (ramiPlayer) ramiPlayer.ramiUsed = true;
    // الرمية مش قابلة إن الدكتور ينقذها — نتيجة قرار، مش هجوم
    ev.push({ kind: "rami", target: n.rami.correct ? n.rami.target : n.rami.by, saved: false, correct: n.rami.correct, accuser: n.rami.by, accused: n.rami.target });
  }
  if (s.nominated !== null && s.nominated !== undefined) ev.push({ kind: "vote", target: s.nominated, saved: healed.includes(s.nominated) });

  const dead = new Set(ev.filter((e) => !e.saved).map((e) => e.target));
  s.players.forEach((p) => { if (dead.has(p.id)) p.alive = false; });

  ev.filter((e) => !e.saved).forEach((e) => s.log.outs.push({ id: e.target, day: s.day, by: e.kind }));
  healed.forEach((id) => s.log.healed.push({ id, day: s.day }));
  s.log.votes.push({ day: s.day, counts: s._counts || {}, out: s.nominated, raw: s._rawVotes || {} });
  delete s._counts;
  delete s._rawVotes;

  s.events = ev;
  s.eventIdx = 0;
  s.result = winner(s);
  s.night = null;

  const st = evalMission(s);
  if (st !== "wait") s.missionStatus = st;

  s.phase = "morning";
  s.deadline = null;
  return s;
}

/** بيقلّب على خبر الصباح اللي بعده. بيرجّع true لو فاضل أخبار. */
function nextEvent(s) {
  if (s.phase !== "morning") return false;
  if (s.eventIdx + 1 < s.events.length) { s.eventIdx += 1; return true; }
  return false;
}

/** بيتنادى لما الكل يخلص قراية أخبار الصباح. */
function afterMorning(s) {
  const traitor = s.players.find((p) => p.role === "traitor");
  if (s.cfg.traitor && traitor && !s.missionShown) {
    if (s.missionStatus === "fail") { s.phase = "traitor"; return s; }
    if (s.missionStatus === "win" && !traitor.alive && !s.result) { s.phase = "traitor"; return s; }
  }
  return proceed(s);
}

function proceed(s) {
  // بنعلّم إن الخاين اتعرض بس لما نكون فعلاً خارجين من شاشة كشفه،
  // مش كل ما اليوم يعدّي — الغلطة دي كانت بتخلي الخاين ميتكشفش أبدًا
  // لو مهمته فشلت في يوم متأخر.
  if (s.phase === "traitor") s.missionShown = true;
  if (s.result) { s.phase = "over"; s.deadline = null; return s; }
  s.day += 1;
  return beginDay(s);
}

/** إحصائيات مسلّية بعد ما اللعبة تخلص — من نفس بيانات التصويت اللي عندنا خلاص. */
function computeFunStats(s) {
  const nameOf = (id) => (findPlayer(s, id) || {}).name || "؟";
  const votesReceived = {};
  const correctVotes = {};
  s.log.votes.forEach((v) => {
    const raw = v.raw || {};
    Object.keys(raw).forEach((voterId) => {
      const a = raw[voterId];
      const list = Array.isArray(a) ? a : (a === null || a === undefined ? [] : [a]);
      list.forEach((targetId) => {
        if (targetId === null || targetId === undefined) return;
        votesReceived[targetId] = (votesReceived[targetId] || 0) + 1;
        const targetPlayer = findPlayer(s, Number(targetId));
        if (targetPlayer && targetPlayer.role === "thief") correctVotes[voterId] = (correctVotes[voterId] || 0) + 1;
      });
    });
  });
  let mostSuspected = null, maxVotes = 0;
  Object.keys(votesReceived).forEach((id) => { if (votesReceived[id] > maxVotes) { maxVotes = votesReceived[id]; mostSuspected = Number(id); } });
  let bestVoter = null, maxCorrect = 0;
  Object.keys(correctVotes).forEach((id) => { if (correctVotes[id] > maxCorrect) { maxCorrect = correctVotes[id]; bestVoter = Number(id); } });
  const suspectPlayer = mostSuspected !== null ? findPlayer(s, mostSuspected) : null;
  return {
    mostSuspected: mostSuspected !== null && maxVotes > 0 ? {
      name: nameOf(mostSuspected), count: maxVotes,
      innocent: !!(suspectPlayer && suspectPlayer.role !== "thief"),
    } : null,
    bestVoter: bestVoter !== null && maxCorrect > 0 ? { name: nameOf(bestVoter), count: maxCorrect } : null,
  };
}

/* ------------------------------ العرض لكل لاعب ------------------------------ */
/**
 * أهم دالة في الملف: بترجّع نسخة من الحالة *مفلترة* حسب اللاعب،
 * فمستحيل يوصل لموبايل حد معلومة مش من حقه — حتى لو فتح أدوات المطوّر.
 */
function viewFor(s, playerId) {
  const me = findPlayer(s, playerId);
  const revealed = (p) => !p.alive || s.phase === "over" || (s.missionShown && p.role === "traitor");
  const iAmThief = me && me.role === "thief";

  const liveCounts = {};
  if (s.phase === "vote") {
    s.players.forEach((p) => (liveCounts[p.id] = 0));
    Object.values(s.votes || {}).forEach((arr) => {
      const list = Array.isArray(arr) ? arr : (arr === null || arr === undefined ? [] : [arr]);
      list.forEach((t) => { if (t !== null && t in liveCounts) liveCounts[t] += 1; });
    });
  }

  const players = s.players.map((p) => ({
    id: p.id,
    name: p.name,
    alive: p.alive,
    connected: p.connected,
    seen: p.seen,
    isHost: p.id === s.hostId,
    voted: s.phase === "vote" ? p.id in s.votes : null,
    votesOn: s.phase === "vote" ? (liveCounts[p.id] || 0) : null, // كام واحد صوّت عليه دلوقتي
    // الدور بيتبعت بس لو: أنا هو، أو طلع برّا، أو اللعبة خلصت، أو إحنا حرامية مع بعض
    role: (me && p.id === me.id) || revealed(p) || (iAmThief && p.role === "thief" && s.phase !== "lobby")
      ? p.role : null,
  }));

  const step = s.phase === "night" && s.night ? s.night.order[s.night.idx] : null;
  const myTurn =
    step === "thieves" ? !!(me && me.role === "thief" && me.alive && !(me.id in s.night.picks)) :
    step === "cop" ? !!(me && me.role === "cop" && me.alive) :
    step === "rami" ? !!(me && me.role === "rami" && me.alive) :
    step === "doctor" ? !!(me && me.role === "doctor" && me.alive) : false;

  return {
    code: s.code,
    phase: s.phase,
    cfg: s.cfg,
    cfgTouched: !!s.cfgTouched,
    missionShown: !!s.missionShown,
    chat: s.chat || [],
    chatEnabled: s.chatEnabled !== false,
    farewellForMe: s.farewell && s.farewell.to === (me && me.id) ? { fromName: (findPlayer(s, s.farewell.from) || {}).name || "؟", text: s.farewell.text } : null,
    canSendFarewell: s.phase === "tally" && s.cfg.lastMessage !== false && !!me && me.id === s.nominated && !s.farewellSentThisRound,
    day: s.day,
    talkRound: s.talkRound,
    talkRounds: s.cfg.talkRounds,
    deadline: s.deadline,
    players,
    you: me ? {
      id: me.id, name: me.name, alive: me.alive, isHost: me.id === s.hostId, seen: me.seen,
      role: me.role,
      partners: me.role === "thief" ? s.players.filter((p) => p.role === "thief" && p.id !== me.id).map((p) => p.name) : [],
      mission: me.role === "traitor" ? s.mission : null,
      myVote: s.phase === "vote" ? (s.votes[me.id] ?? null) : null,
    } : null,
    nightStep: step,
    nightProgress: (s.phase === "night" && s.night) ? (function () {
      const total = s.night.order.length;
      const idx = s.night.idx;
      let done = 0, actors = 1;
      if (step === "thieves") {
        actors = s.players.filter((p) => p.alive && p.role === "thief").length;
        done = Object.keys(s.night.picks || {}).length;
      }
      return { step, stepNo: idx + 1, steps: total, done, actors };
    })() : null,
    myTurn,
    doctorHeals: doctorHeals(s.cfg),
    doctorConfirm: doctorConfirmMode(s.cfg),
    nominatedName: s.phase === "night" && step === "doctor" && doctorConfirmMode(s.cfg) && s.nominated !== null
      ? (findPlayer(s, s.nominated) || { name: null }).name : null,
    // نتايج التصويت بتظهر بعد ما يتقفل بس
    voteCounts: s.phase === "morning" || s.phase === "over" ? (s.log.votes[s.log.votes.length - 1] || { counts: null }).counts : null,
    eventIdx: s.eventIdx,
    voteOutcome: s.voteOutcome || null,
    voteNonce: s.voteNonce || 0,
    tieAlert: (function () {
      if (s.phase === "lobby" || s.phase === "reveal" || s.phase === "over") return null;
      const t = tieState(s);
      if (!t.reached) return null;
      return { remaining: t.remaining, iAmThief: !!iAmThief };
    })(),
    runoff: s.runoff ? { candidates: s.runoff.candidates.slice(), excludedVoters: s.runoff.excludedVoters.slice() } : null,
    events: s.phase === "morning" || s.phase === "over"
      ? s.events.map((e) => ({
          kind: e.kind, saved: e.saved,
          name: e.saved && e.kind !== "vote" ? null : (findPlayer(s, e.target) || { name: null }).name,
          role: e.saved ? null : roleOf(s, e.target),
          correct: e.kind === "rami" ? e.correct : null,
          accuserName: e.kind === "rami" ? (findPlayer(s, e.accuser) || { name: null }).name : null,
          accusedName: e.kind === "rami" ? (findPlayer(s, e.accused) || { name: null }).name : null,
        })) : [],
    traitorReveal: (s.phase === "traitor" || s.phase === "over") && s.mission ? {
      name: (s.players.find((p) => p.role === "traitor") || { name: null }).name,
      text: s.mission.text, hard: s.mission.hard, status: s.missionStatus,
    } : null,
    // تقرير التصويت الكامل — بيبان بس لما اللعبة تخلص، عشان محدش يستفيد
    // من معرفة مين صوّت على مين وهو لسه بيلعب.
    voteHistory: s.phase === "over" ? s.log.votes.map((v) => dayTally(s, v.day, v.counts, v.raw, v.out)) : null,
    funStats: s.phase === "over" ? computeFunStats(s) : null,
    funStats: s.phase === "over" ? computeFunStats(s) : null,
    // سجل الأحداث كامل من أول يوم — بيبان دايمًا (مش سري)، لأنه نفس المعلومة
    // اللي بتتعلن كل صباح، بس محفوظة عشان تتقرا تاني بعدين. اللي اتضرب بالليل
    // ونجا بيفضل مجهول (نفس قاعدة الخصوصية بتاعة شاشة الصباح بالظبط).
    gameLog: (() => {
      const nameOf = (id) => id === null || id === undefined ? null : ((findPlayer(s, Number(id)) || {}).name || "؟");
      const entries = [];
      for (let d = 1; d <= s.day; d++) {
        const voteEntry = s.log.votes.find((v) => v.day === d);
        if (voteEntry) {
          entries.push({
            day: d, kind: "vote",
            name: voteEntry.out !== null ? nameOf(voteEntry.out) : null,
            outcome: voteEntry.out !== null ? "out" : (Object.values(voteEntry.counts || {}).some((c) => c > 0) ? "tie" : "none"),
          });
        }
        s.log.outs.filter((o) => o.day === d).forEach((o) => entries.push({ day: d, kind: o.by, name: nameOf(o.id) }));
        if (s.log.healed.some((h) => h.day === d)) entries.push({ day: d, kind: "saved" });
      }
      return entries;
    })(),
    // تقرير اليوم اللي لسه ماتعلنش هويته — بيبان في طور "tally" بس، بعد
    // ما التصويت يقفل وقبل ما نعرف مين طلع بالظبط.
    tallyReport: s.phase === "tally" ? dayTally(s, s.day, s._counts || {}, s._rawVotes || {}, s.nominated) : null,
    result: s.result,
    version: s.version,
  };
}

/** بيرجّع تفاصيل تصويت يوم واحد: مين طلع، وكل واحد أخد كام صوت وممين. */
function dayTally(s, day, counts, raw, out) {
  const nameOf = (id) => id === null || id === undefined ? null : ((findPlayer(s, Number(id)) || {}).name || "؟");
  const listOf = (a) => Array.isArray(a) ? a : (a === null || a === undefined ? [] : [a]);
  const targets = Object.keys(counts || {}).filter((k) => counts[k] > 0).map(Number);
  const totalVoters = Object.keys(raw || {}).length;
  return {
    day,
    outcome: out !== null && out !== undefined ? "ok" : (targets.length ? "tie" : "none"),
    outName: nameOf(out),
    outId: out !== null && out !== undefined ? Number(out) : null,
    totalVoters,
    tally: targets.map((targetId) => ({
      id: targetId,
      name: nameOf(targetId),
      count: counts[targetId],
      voters: Object.keys(raw || {}).filter((voterId) =>
        listOf(raw[voterId]).map(Number).includes(targetId)
      ).map((voterId) => nameOf(voterId)),
      // اللي الشخص ده صوّت عليه هو بنفسه (مفيدة في شاشة الإحصائيات)
      votedFor: (targetId in (raw || {})) ? listOf(raw[targetId]).map(nameOf) : null,
    })).sort((a, b) => b.count - a.count),
  };
}

var EngineExports = {
  ROLES, ROLE_DESC, MISSIONS, DEFAULT_CFG,
  suggestCfg, validateCfg, makeCode, createRoom,
  addPlayer, removePlayer, startGame, markSeen, autoCfg,
  beginDay, nextTalkRound, beginVote, castVote, voteCounts, closeVote, runoffVoters,
  beginNight, nightAction, resolveMorning, nextEvent, afterMorning, proceed,
  winner, tieState, viewFor, findPlayer, alivePlayers, doctorHeals, doctorConfirmMode,
  evalMission, pickMission, shuffle,
  setClock: (fn) => { now = fn; },
};
if (typeof module !== 'undefined' && module.exports) module.exports = EngineExports;
else global.Engine = EngineExports;
})(typeof window !== 'undefined' ? window : global);

<script>
/*
 * حرامية وأهل القرية — عقل المضيف (Host Brain)
 * © 2026 فرحات زايد — كل الحقوق محفوظة.
 *
 * الجهاز اللي عامل "استضافة" هو الوحيد اللي بيشغّل الملف ده. هو اللي ماسك
 * حالة اللعبة الحقيقية بكل الأسرار، وهو اللي بيقرر، وبعد كل قرار بيبعت
 * لكل لاعب النسخة اللي يخصه بس عن طريق viewFor (نفس الفلترة المستخدمة
 * في نسخة السيرفر) — الفرق إن "السيرفر" هنا هو موبايل حقيقي بيفضل فاتح.
 */
(function (global) {
  "use strict";
  var E = (typeof module !== "undefined" && module.exports) ? require("./engine.js") : global.Engine;

  function HostBrain(backend, code, hostUid, hostName, chatEnabled) {
    this.backend = backend;
    this.code = code;
    this.state = E.createRoom(code, null);
    this.state.chatEnabled = chatEnabled !== false; // افتراضيًا مفعّل لو محددش
    this.uidToId = {};      // uid فايربيز -> رقم داخلي (زي ما كان بيحصل في السيرفر)
    this.idToUid = {};
    this.nextId = 0;
    this.timer = null;
    this.hostUid = hostUid;
    this.addPlayer(hostUid, hostName);
    this.state.hostId = this.uidToId[hostUid];
  }

  HostBrain.prototype.addPlayer = function (uid, name) {
    if (uid in this.uidToId) return this.uidToId[uid];
    var id = this.nextId++;
    this.uidToId[uid] = id;
    this.idToUid[id] = uid;
    E.addPlayer(this.state, { id: id, token: uid, name: name });
    return id;
  };

  HostBrain.prototype.broadcast = function () {
    var self = this;
    var onErr = function (e) { if (self.onError) self.onError(e); };
    this.backend.set("rooms/" + this.code + "/meta", {
      phase: this.state.phase,
      count: this.state.players.length,
      hostOnline: true,
      hostHeartbeat: this.backend.now(),
    }).catch(onErr);

    this.state.players.forEach(function (p) {
      var uid = self.idToUid[p.id];
      var view = E.viewFor(self.state, p.id);

    });
  };

  HostBrain.prototype.armTimer = function () {
    var self = this;
    if (this.timer) { this.backend.clearTimer(this.timer); this.timer = null; }
    if (!this.state.deadline) return;
    var ms = Math.max(400, this.state.deadline - this.backend.now());
    this.timer = this.backend.setTimer(function () {
      self.timer = null;

  var STEP_ACTIONS = {
    start: 1, forceVote: 1, tallyNext: 1, revote: 1, runoff: 1, morningNext: 1,
    next: 1, night: 1, vote: 1, again: 1, restart: 1, startTimer: 1,
  };

    } catch (e) { /* لو فشل التخزين منوقّعش اللعبة */ }

      this.state.deadline = null;

    } catch (e) { return false; }

      new Date().toTimeString().slice(0,8) + " — المضيف استلم أمر: " + msg.t + " من " + uid.slice(0,8));
    var s = this.state;
    var self = this;
    try {
      if (msg.t === "join") { this.addPlayer(uid, msg.name); this.afterChange(); return; }

      var id = this.uidToId[uid];
      if (id === undefined) return; // مش عضو في الأوضة دي
      var isHost = s.hostId === id;

      if (STEP_ACTIONS[msg.t]) this.snapshot();

      if (msg.t === "undo") {
        if (!isHost) return;
        if (this.undo()) { this.armTimer(); this.afterChange(); }
        return;
      }

      switch (msg.t) {
        case "cfg": {
          if (!isHost) return;
          if (s.phase !== "lobby") return;
          var merged = Object.assign({}, s.cfg, msg.cfg || {});
          merged.thieves = Math.max(1, Math.min(7, Number(merged.thieves) || 1));
          merged.talkSeconds = Math.max(15, Math.min(600, Number(merged.talkSeconds) || 120));
          merged.voteSeconds = Math.max(10, Math.min(300, Number(merged.voteSeconds) || 60));
          merged.talkRounds = Math.max(1, Math.min(4, Number(merged.talkRounds) || 2));
          merged.doctorHealCount = Math.max(1, Math.min(3, Number(merged.doctorHealCount) || 1));
          merged.villagersToWin = Math.max(1, Math.min(5, Number(merged.villagersToWin) || 1));
          merged.villagersToTie = Math.max(1, Math.min(5, Number(merged.villagersToTie) || 1));

        }
        case "setChatEnabled": {

          s.chatEnabled = !!msg.value;
          break;

        case "seen": { E.markSeen(s, id); break; }
        case "next": { if (!isHost || s.phase !== "day") return; E.nextTalkRound(s); break; }
        case "startTimer": {
          if (!isHost || s.phase !== "day") return;

          if (!E.runoffVoters(s).length) { s.runoff = null; s._tied = null; E.beginNight(s); break; }
          s.votes = {}; delete s._counts; delete s._rawVotes; s._tied = null;
          E.beginVote(s);
          break;
        }
        case "night": { E.nightAction(s, id, msg); break; }
        case "morningNext": {
          if (!isHost) return;
          if (s.phase === "morning") { if (!E.nextEvent(s)) E.afterMorning(s); }
          else if (s.phase === "traitor") E.proceed(s);
          else return;
          break;
        }
        case "again": {
          if (!isHost || s.phase !== "over") return;
          s.phase = "lobby";
          s.players.forEach(function (p) { p.role = null; p.alive = true; p.seen = false; });
          s.day = 0; s.events = []; s.eventIdx = 0; s.result = null;
          s.log = { outs: [], healed: [], votes: [] };
          s.mission = null; s.missionStatus = "wait"; s.missionShown = false;
          s.voteOutcome = null; s.deadline = null; s.night = null; s.votes = {}; s.runoff = null; s._tied = null;
          break;
        }
        case "restart": {
          // لعبة تانية سريعة بنفس الأدوار والإعدادات — من غير المرور باللوبي.
          // المرونة لتغيير الأدوار لسه موجودة عن طريق "again" العادي.
          if (!isHost || s.phase !== "over") return;
          s.players.forEach(function (p) { p.role = null; p.alive = true; p.seen = false; });
          s.day = 0; s.events = []; s.eventIdx = 0; s.result = null;
          s.log = { outs: [], healed: [], votes: [] };
          s.mission = null; s.missionStatus = "wait"; s.missionShown = false;
          s.voteOutcome = null; s.deadline = null; s.night = null; s.votes = {}; s.runoff = null; s._tied = null;
          E.startGame(s);
          break;
        }
        case "farewell": {
          if (s.cfg.lastMessage === false) return;
          if (s.phase !== "tally" || id !== s.nominated || s.farewellSentThisRound) return;
          var toP = E.findPlayer(s, Number(msg.to));
          if (!toP || toP.id === id) return;
          var fText = String(msg.text || "").trim().slice(0, 200);
          if (!fText) return;
          s.farewell = { from: id, to: toP.id, text: fText };
          s.farewellSentThisRound = true;
          break;
        }
        case "farewellSeen": {
          if (s.farewell && s.farewell.to === id) s.farewell = null;
          break;
        }
        case "chat": {
          if (s.chatEnabled === false) return;
          var p4c = E.findPlayer(s, id); if (!p4c) return;
          var text = String(msg.text || "").trim().slice(0, 300);
          if (!text) return;
          s.chat = s.chat || [];
          s.chat.push({ from: id, name: p4c.name, text: text, t: this.backend.now() });
          if (s.chat.length > 200) s.chat = s.chat.slice(-200);
          break;
        }
        case "emoji": {
          var p3 = E.findPlayer(s, id); if (!p3) return;
          this.backend.push("rooms/" + this.code + "/emoji", { from: id, name: p3.name, e: String(msg.e || "").slice(0, 8), t: this.backend.now() });
          this.broadcast();
          return; // مفيش داعي نعمل afterChange تاني (فيه armTimer مش لازم)
        }
        case "leave": {
          if (s.phase === "lobby") {
            s.players = s.players.filter(function (x) { return x.id !== id; });
            if (s.hostId === id && s.players[0]) s.hostId = s.players[0].id;
          } else {
            var p4 = E.findPlayer(s, id); if (p4) p4.connected = false;
          }
          break;
        }
        default: return;
      }
    } catch (e) {
      // أمر غير صالح (زي محاولة بدء اللعبة بعدد لاعبين ناقص) — مش بنوقّف اللعبة،
      // بس لازم اللاعب يعرف حصل إيه بدل ما الحركة تتبلع بصمت.
      if (this.onError) this.onError(e);
      return;
    }

  };

  else global.HostBrain = HostBrain;
})(typeof window !== "undefined" ? window : global);

  var E = (typeof module !== "undefined" && module.exports) ? require("./engine.js") : global.Engine;

  function makeCode() {
    var A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", c = "";
    for (var i = 0; i < 4; i++) c += A[Math.floor(Math.random() * A.length)];
    return c;

    this.backend = backend;
    this.uid = uid;
    this.name = name;
    this.code = null;
    this.state = null;
    this.isHost = false;
    this.hostBrain = null;

    this.onEmoji = null;
    this._unsubs = [];

  GameClient.prototype._cleanup = function () {
    this._unsubs.forEach(function (u) { u(); });
    this._unsubs = [];
  };

  GameClient.prototype.createRoom = function (chatEnabled) {
    this._cleanup();
    var code = makeCode();

    this._listen();

  };

  GameClient.prototype.joinRoom = function (code) {
    this._cleanup();

    this._listen();
    this.send({ t: "join", name: this.name });
  };

  /** لو التطبيق اتقفل وكان هو المستضيف، بيرجع يفتحه من النسخة المحفوظة. غير متزامنة لأنها بتقرا من الشبكة. */
  GameClient.prototype.resumeHost = function (code) {
    var self = this;
    return this.backend.readOnce("rooms/" + code + "/hostBackup/raw").then(function (raw) {
      if (!raw) return false;

      self.hostBrain = new HostBrain(self.backend, code, self.uid, self.name);

    });
  };
  /** فحص سريع (وقت الانضمام) إن الأوضة موجودة أصلًا قبل ما نبعت نيّة دخول. */
  GameClient.prototype.roomExists = function (code) {
    return this.backend.readOnce("rooms/" + code + "/meta").then(function (m) { return !!m; });
  };

  GameClient.prototype._listen = function () {
    var self = this;
    this._unsubs.push(this.backend.onValue("rooms/" + this.code + "/views/" + this.uid, function (v) {
      self.state = v;
      if (self.onState) self.onState(v);
    }));
    this._unsubs.push(this.backend.onValue("rooms/" + this.code + "/emoji", function (v) {
      if (!v) return;
      Object.keys(v).forEach(function (k) {
        if (self._seenEmojiKeys[k]) return;
        self._seenEmojiKeys[k] = true;
        if (self.onEmoji) self.onEmoji(v[k]);
      });
    }));
    if (this.isHost) {
      this._unsubs.push(this.backend.onChildAdded("rooms/" + this.code + "/intents", function (key, val) {
        self.hostBrain.handle(val.uid, val.msg);
        self.backend.remove("rooms/" + self.code + "/intents/" + key);
      }));
    }
  };

  GameClient.prototype.send = function (msg) {
    if (!this.code) return;
    this.backend.push("rooms/" + this.code + "/intents", { uid: this.uid, msg: msg });
  };

  GameClient.prototype.leave = function () {
    this.send({ t: "leave" });
    this._cleanup();
    this.code = null; this.state = null; this.isHost = false; this.hostBrain = null;
  };

  if (typeof module !== "undefined" && module.exports) module.exports = { GameClient: GameClient, makeCode: makeCode };
  else global.GameClient = GameClient;

/** نغمة واحدة: تردد من f1 لـ f2، بشكل موجة معيّن، بمدة ووقت بداية */
function tone(f1, f2, dur, type, at, vol) {
  var c = actx(); if (!c) return;
  var t0 = c.currentTime + (at || 0);

  if (f2 && f2 !== f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.22, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

function thud(at, vol) {

  var t0 = c.currentTime + (at || 0), len = Math.floor(c.sampleRate * 0.3);

  for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);

  var f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 420;
  var g = c.createGain(); g.gain.value = vol || 0.5;

/** بيقرر أنهي صوت يتشغّل حسب اللي ظاهر على الشاشة دلوقتي */
function updateSfx() {

  var p = state.phase;
  if (p === "tally") {
    sfxOnce("tally-" + state.day + "-" + (state.voteOutcome || ""), state.voteOutcome === "none" ? "nobody" : "tally");
    return;
  }
  if (p === "morning") {
    if (!state.events || !state.events.length) { sfxOnce("morn-" + state.day + "-empty", "nobody"); return; }
    var e = state.events[state.eventIdx];
    if (!e) return;
    var key = "morn-" + state.day + "-" + state.eventIdx;
    var name;
    if (e.saved) name = "saved";
    else if (e.kind === "rami") name = e.correct ? "caught" : "innocent";
    else if (e.kind === "thief") name = "kill";
    else if (e.kind === "cop") name = e.role === "thief" ? "caught" : "innocent";
    else if (e.kind === "vote") name = e.role === "thief" ? "caught" : "innocent";
    else name = "tally";
    sfxOnce(key, name);

  }
  if (p === "traitor") { sfxOnce("traitor-" + state.day, "traitor"); return; }
  if (p === "over") {

/** بتمسح قاعدة بيانات heartbeat الداخلية بتاعة فايربيز لو كانت موجودة أو
 *  تالفة — باج معروف موثّق في SDK فايربيز نفسه. عملية آمنة تمامًا: مفيش
 *  فيها أي بيانات بتاعة اللعبة، هي بس إحصائيات استخدام داخلية لفايربيز. */
function wipeHeartbeatDB() {
  return new Promise(function (resolve) {
    try {
      if (!window.indexedDB || !indexedDB.deleteDatabase) return resolve();
      var req = indexedDB.deleteDatabase("firebase-heartbeat-database");
      req.onsuccess = function () { resolve(); };
      req.onerror = function () { resolve(); };
      req.onblocked = function () { resolve(); };
      setTimeout(resolve, 1500); // حماية لو الحدث اتأخر لأي سبب
    } catch (e) { resolve(); }
  });
}

async function boot() {
  try {
    // باج معروف وموثّق في SDK فايربيز نفسه (firebase/firebase-js-sdk#7736):
    // خدمة داخلية اسمها heartbeatService بتخزّن بيانات في IndexedDB، ولو
    // البيانات دي بقت تالفة (بيحصل مع الوقت في بعض المتصفحات) بتوقّع
    // بالظبط بالخطأ "Cannot read properties of undefined (reading 'length')".
    // بنمسحها هنا استباقيًا قبل ما فايربيز يشتغل، عشان محدش يتأثر بيها.
    await wipeHeartbeatDB();
    var app0 = firebase.initializeApp(FIREBASE_CONFIG);
    var backend = new window.FirebaseBackend(app0);
    backend.onError = function (e) { showToast("فشلت عملية مع فايربيز: " + ((e && (e.code || e.message)) || e)); };
    var uid = await backend.signIn();
    window.__backend = backend;
    window.__uid = uid;
    conn = "ready";
    render();
  } catch (e) {
    conn = "error";
    connError = friendlyError(e);
    render();
  }
}
function friendlyError(e) {

  if (/offline/i.test(m)) return "مفيش اتصال بالنت. اتأكد إنك متوصّل وجرّب تاني.";
  if (/unauthorized[_-]?domain/i.test(m)) return "الدومين ده مش مسموح في فايربيز — روح Authentication ← Settings ← Authorized domains وضيف الدومين اللي فاتح منه.";
  if (/network[_-]?request[_-]?failed/i.test(m)) return "النت قطع في نص الاتصال بفايربيز. جرّب تاني، ولو بتستخدم VPN أو نت ضعيف جرّب تقفله أو تغيّر الشبكة.";
  if (/timeout/i.test(m)) return "فايربيز ماردّش، حتى بعد ما جرّبنا نتخطى بيانات الدخول المخزّنة. غالبًا في تبويب تاني للّعبة مفتوح ماسك البيانات — اقفل كل التبويبات وافتح واحد بس. ولو المشكلة فضلت، دوس \"امسح بيانات المتصفح وافتح من الأول\" تحت.";
  if (/permission[_-]denied/i.test(m)) return "مينفعش نوصل لقاعدة البيانات. تأكد إنك نشرت قواعد الأمان (Rules) في Firebase Console ودست Publish.";
  if (/network/i.test(m)) return "مفيش اتصال بالنت. تأكد إنك متوصّل وجرّب تاني.";
  if (/api[_-]?key/i.test(m)) return "كود إعداد Firebase (Config) غلط أو ناقص.";
  if (/auth\/admin-restricted-operation|operation-not-allowed/i.test(m)) return "الدخول المجهول (Anonymous) مش مفعّل في Firebase — روح Authentication ← Sign-in method وفعّله.";
  if (/firebase is not defined/i.test(m)) return "ملفات فايربيز نفسها مش اتحمّلت — يعني في حاجة بتحجب gstatic.com. جرّب شبكة تانية أو اقفل الـVPN.";
  return "حصل خطأ في الاتصال: " + m;

var lastMeta = null;
var unsubMeta = null;
var hostStaleShown = false;
var HOST_TIMEOUT_MS = 20000; // المضيف بيبعت نبضة كل ٨ ثواني، فلو غاب ٢٠ ثانية نبقى نقلق

function makeClient(name) {
  client = new window.GameClient(window.__backend, window.__uid, name);
  client.onState = function (v) {
    // فايربيز الحقيقي أحيانًا بيبعت تحديث جزئي (مثلاً حقل واحد اتغيّر) بدل
    // نسخة كاملة. لو استلمنا حاجة ناقصة (مفيش فيها players/you) بنتجاهلها
    // بدل ما نعرضها ونوقع — ده اللي كان بيسبب "التجمّد" اللي إحنا بنصلّحه.
    if (v && (!Array.isArray(v.players) || !v.phase)) {
      if (window.__firebaseDebugLog) window.__firebaseDebugLog.push(
        new Date().toTimeString().slice(0, 8) + " — !! تجاهلنا تحديث ناقص (مفيش فيه players/phase كاملين)");
      return;
    }
    state = v;
    if (joinWaitTimer) { clearInterval(joinWaitTimer); joinWaitTimer = null; }
    joinWaitStartedAt = null;
    render();
  };
  client.onEmoji = function (m) { popEmoji(m.e); };
}
/** المضيف بس هو اللي بيكتب النبضة دي — الباقي بيتابعوها عشان يعرفوا لو غاب فترة طويلة. */
function watchHostHeartbeat(code) {
  if (unsubMeta) { unsubMeta(); unsubMeta = null; }
  lastMeta = null; hostStaleShown = false;
  unsubMeta = window.__backend.onValue("rooms/" + code + "/meta", function (m) { lastMeta = m; });
}
function isHostStale() {
  if (!client || client.isHost || !lastMeta || !lastMeta.hostHeartbeat) return false;
  return (Date.now() - lastMeta.hostHeartbeat) > HOST_TIMEOUT_MS;
}

/* ---------------------------- عمليات ---------------------------- */
/* ---------------------------- منع قفل الشاشة وقت اللعب ----------------------------
 * لو الشاشة قفلت، المتصفح بيوقف الاتصال بفايربيز تمامًا — وده بالظبط اللي كان
 * بيخلّي لاعبين جداد يفضلوا عالقين على "بنجهّز الأوضة" للأبد لو المستضيف قفلت
 * شاشته. الحل: نمنع الشاشة من القفل طول ما إحنا جوه أوضة فعليًا. */
var wakeLock = null;
var joinWaitStartedAt = null;
var joinWaitTimer = null;
function startJoinWaitWatch() {
  joinWaitStartedAt = Date.now();
  if (joinWaitTimer) clearInterval(joinWaitTimer);
  joinWaitTimer = setInterval(function () { if (!state) render(); else { clearInterval(joinWaitTimer); joinWaitTimer = null; } }, 1000);
}
async function keepAwake() {
  try {
    if (!("wakeLock" in navigator)) return;
    wakeLock = await navigator.wakeLock.request("screen");
  } catch (e) { /* بعض المتصفحات (خصوصًا القديمة) مش بتدعمها — نكمّل عادي من غيرها */ }
}
function releaseWakeLock() {
  try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
}
document.addEventListener("visibilitychange", function () {
  // الـwake lock بيتشال تلقائي لو التاب راح للخلفية — نرجّعه أول ما يرجع ظاهر
  if (document.visibilityState === "visible" && client) keepAwake();
});

function doCreate() {
  if (!myName.trim()) return;
  localStorage.setItem("haramia-name", myName.trim());
  makeClient(myName.trim());
  client.createRoom(true);
  if (client.hostBrain) client.hostBrain.onError = function (e) { showToast("مشكلة في اللعبة: " + ((e && e.message) || e)); };
  watchHostHeartbeat(client.code);
  saveSession();
  keepAwake();
  startJoinWaitWatch();
  render();
}
async function doJoin() {
  var code = joinCode.trim().toUpperCase();
  if (code.length !== 4 || !myName.trim()) return;
  localStorage.setItem("haramia-name", myName.trim());
  makeClient(myName.trim());
  var exists = await client.roomExists(code);
  if (!exists) { connError = "مفيش أوضة بالكود ده. تأكد من الكود مع صاحب الأوضة."; client = null; render(); return; }
  connError = "";
  client.joinRoom(code);
  watchHostHeartbeat(code);
  saveSession();
  keepAwake();
  startJoinWaitWatch();
  render();
}
async function doResume() {
  if (!savedSession) return;
  makeClient(savedSession.name);
  if (savedSession.wasHost) {
    var ok = await client.resumeHost(savedSession.code);
    if (client.hostBrain) client.hostBrain.onError = function (e) { showToast("مشكلة في اللعبة: " + ((e && e.message) || e)); };
    if (!ok) { connError = "مقدرناش نرجّع الأوضة — يمكن قفلت خالص. ابدأ أوضة جديدة."; client = null; clearSession(); render(); return; }
  } else {
    var exists = await client.roomExists(savedSession.code);
    if (!exists) { connError = "الأوضة اللي كنت فيها مبقتش موجودة."; client = null; clearSession(); render(); return; }
    client.joinRoom(savedSession.code);
  }
  watchHostHeartbeat(savedSession.code);
  saveSession();
  keepAwake();
  startJoinWaitWatch();
  render();
}
function doLeave() {
  if (client) client.leave();
  if (unsubMeta) { unsubMeta(); unsubMeta = null; }
  client = null; state = null; lastMeta = null; hostStaleShown = false;
  chatOpen = false;
  clearSession();
  releaseWakeLock();
  if (joinWaitTimer) { clearInterval(joinWaitTimer); joinWaitTimer = null; }
  joinWaitStartedAt = null;
  render();
}

    var waited = joinWaitStartedAt ? (Date.now() - joinWaitStartedAt) / 1000 : 0;
    if (waited > 15) {
      return '<div class="mid ctr"><div class="errbox">الأوضة مش بتردّ من شوية. يمكن الشخص اللي عمل الأوضة قفل شاشة موبايله أو نتّه اتقطع.</div>' +
        '<button class="btn dark mt" data-a="retryJoin">جرّب تاني</button>' +
        '<button class="btn ghost mt" data-a="leave">ارجع للصفحة الرئيسية</button></div>' + footer();
    }
    return '<div class="mid ctr"><div class="spin"></div><p class="d" style="margin-top:16px">بنجهّز الأوضة…</p></div>' + footer();
  }

  var body = "";
  switch (state.phase) {
    case "lobby": body = lobbyScreen(); break;
    case "reveal": body = revealScreen(); break;
    case "day": body = dayScreen(); break;
    case "vote": body = voteScreen(); break;
    case "tally": body = tallyScreen(); break;
    case "night": body = nightScreen(); break;
    case "morning": body = morningScreen(); break;
    case "traitor": body = traitorScreen(); break;
    case "over": body = overScreen(); break;
    default: body = '<div class="mid ctr"><div class="spin"></div></div>';
  }
  var banner = (state.phase === "day" || state.phase === "vote" || state.phase === "tally") ? tieBannerHTML() : "";
  return netBar() + banner + body + footer() + uiSheetHTML();
}

    h += '<div class="soft"><div class="badges">' + badge(ar(cfg.thieves) + " حرامية", ROLES.thief.color) +

      (cfg.traitor ? badge("خاين", ROLES.traitor.color) : "") +
      (cfg.rami ? badge("الرصاصة الأخيرة", ROLES.rami.color) : "") +
      badge(villagers > 0 ? ar(villagers) + " أهل قرية" : "مفيش أهل قرية", ROLES.villager.color) + "</div>" +

    h += '<button class="btn mt" data-a="start"' + (n < 3 || villagers < 1 ? " disabled" : "") + ">" +

    '<div class="knob' + (on ? " on" : "") + '"><i></i></div></div>';
}

var dayTimerChoice = 60; // اختيار مدة التايمر قبل ما نشغّله (بالثواني)، من ٣٠ لـ١٢٠
var farewellTarget = null; // اللاعب المختار لإرسال السر ليه
var voteSel = [];          // اللي أنا مختارهم دلوقتي في التصويت (قبل التأكيد)
var voteKey = null;        // بيتغيّر كل جولة تصويت جديدة عشان نصفّر الاختيار

function dayScreen() {
  var left = state.deadline ? Math.max(0, (state.deadline - Date.now()) / 1000) : null;
  var alive = state.players.filter(function (p) { return p.alive; });
  var h = '<p class="eb">راوند الكلام ' + ar(state.talkRound) + " من " + ar(state.talkRounds) + '</p><h1 class="t">اتكلّموا</h1>' +
    '<p class="d">كل واحد يقول رأيه ويدافع عن نفسه.</p>';
  h += '<div class="mid ctr">';
  if (state.deadline) {
    h += '<div class="timer"' + (left !== null && left < 15 ? ' style="color:var(--madder)"' : "") + ">" + mmss(left || 0) + "</div>";
  } else {
    h += '<div class="timer" style="color:var(--faint);font-size:30px">🔒 مقفول</div>';
    if (state.you.isHost) {
      h += '<div class="step mt"><button data-a="dtimer:-15">−</button><div class="v">' + mmss(dayTimerChoice) + '</div><button data-a="dtimer:15">+</button></div>' +
        '<button class="btn dark sm mt" data-a="startTimer">شغّل التايمر</button>';
    }
  }
  h += '<p class="d mt">في الدور ' + ar(alive.length) + " · طلعوا " + ar(state.players.length - alive.length) + "</p>" +
    '<div class="emos">' + ["😂", "😱", "🤨", "👀", "🔪", "🙏"].map(function (e) { return '<button class="emo" data-emo="' + e + '">' + e + "</button>"; }).join("") + "</div></div>";
  if (state.you.isHost) h += '<button class="btn" data-a="next">' + (state.talkRound < state.talkRounds ? "الراوند اللي بعده" : "ابدأ التصويت") + "</button>";
  else h += '<p class="d ctr">مستنيين المضيف يكمّل…</p>';
  return h;
}

function voteScreen() {
  var left = state.deadline ? Math.max(0, (state.deadline - Date.now()) / 1000) : null;
  var ro = state.runoff;                              // معلومات إعادة التعادل (أو null)
  var iAmRevealedTraitor = state.missionShown && state.you.role === "traitor";
  var iAmExcluded = !!(ro && ro.excludedVoters.indexOf(state.you.id) !== -1);
  var canVote = state.you.alive && !iAmRevealedTraitor && !iAmExcluded;

  // نصفّر الاختيار المحلي أول ما تبدأ جولة تصويت جديدة، ونبدأ من اللي أنا مأكّده قبل كده
  if (voteKey !== state.voteNonce) {
    voteKey = state.voteNonce;
    voteSel = Array.isArray(state.you.myVote) ? state.you.myVote.slice() : [];
  }
  var submitted = Array.isArray(state.you.myVote); // أكّدت تصويتي في الجولة دي؟

  // مين ينفع نصوّت عليهم: في الإعادة المتعادلين بس، غير كده كل اللي في الدور
  var candIds = ro ? ro.candidates.slice() : state.players.filter(function (p) {
    return p.alive && !(state.missionShown && p.role === "traitor");
  }).map(function (p) { return p.id; });
  var cands = candIds.map(function (cid) { return state.players.find(function (p) { return p.id === cid; }); })
    .filter(function (p) { return p && p.id !== state.you.id; });

  var title = iAmRevealedTraitor ? "اتكشفت كخاين"
    : iAmExcluded ? "إنت من المتعادلين"
    : !state.you.alive ? "أنت برّا الدور"
    : ro ? "إعادة التصويت على المتعادلين"
    : "على مين شاكك؟";
  var sub = iAmRevealedTraitor ? "بعد ما اتكشفت، مبقاش ليك حق التصويت — بس شارك في الكلام وساعد أهل القرية عادي."
    : iAmExcluded ? "إنت من اللي عليهم أعلى الأصوات، فمش هتصوّت في الإعادة — الباقي هم اللي هيحسموا."
    : !state.you.alive ? "اتفرّج بس."
    : ro ? "صوّت على واحد أو أكتر من المتعادلين، لحد ما حد يطلع."
    : "تقدر تختار أكتر من واحد. اختيارك سري لحد ما الكل يخلص.";

  var h = '<p class="eb">' + (ro ? "إعادة التصويت" : "التصويت") + " · باقي " + mmss(left || 0) + '</p><h1 class="t">' +
    title + "</h1><p class=\"d\" style=\"margin-bottom:12px\">" + sub + "</p><div class=\"grid\">";

  // العدد اللي بيبان = أصوات الناس المؤكّدة، بس محسوب عليها اختياري الحالي فورًا
  // (حتى قبل ما أدوس "أكّد")، فلو شلت اختياري الرقم بينقص على طول.
  var myConfirmed = Array.isArray(state.you.myVote) ? state.you.myVote : [];
  function liveCount(p) {
    var c = p.votesOn || 0;
    if (myConfirmed.indexOf(p.id) !== -1) c -= 1;   // شيل صوتي المؤكّد القديم
    if (voteSel.indexOf(p.id) !== -1) c += 1;       // وحط اختياري الحالي مكانه
    return Math.max(0, c);
  }

  cands.forEach(function (p) {
    var picked = voteSel.indexOf(p.id) !== -1;
    var vc = liveCount(p);
    h += '<button data-a="votePick:' + p.id + '" class="pick' + (picked ? " sel" : "") + '"' + (!canVote ? " disabled" : "") + ">" +
      '<span class="vcount' + (vc ? "" : " zero") + '">' + ar(vc) + "</span>" +
      esc(p.name) + (picked ? '<div class="pickVoted">مختار</div>' : (p.voted ? '<div class="pickVoted">صوّت</div>' : "")) + "</button>";
  });
  h += "</div>";

  if (canVote) {
    var n = voteSel.length;
    var confirmLabel = submitted
      ? (n ? "✓ اتأكّد (" + ar(n) + ") — عدّل وأكّد تاني" : "✓ ممتنع — عدّل وأكّد تاني")
      : (n ? "أكّد التصويت (" + ar(n) + ")" : "أكّد الامتناع");
    h += '<button class="btn mt" data-a="voteConfirm">' + confirmLabel + "</button>";
    if (n) h += '<button class="btn ghost sm mt" style="font-size:13px;padding:10px" data-a="voteClear">امسح اختياري</button>';
    if (submitted) h += '<p class="d ctr mt" style="font-size:12.5px">تصويتك اتسجّل. تقدر تعدّله لحد ما التصويت يتقفل.</p>';
  }
  if (state.you.isHost) h += '<button class="btn dark mt" data-a="forceVote">اقفل التصويت دلوقتي</button>';
  return h;
}

function tallyScreen() {
  var t = state.tallyReport;
  if (!t) return '<div class="mid ctr"><div class="spin"></div></div>';
  var h = '<p class="eb">نتيجة التصويت</p><h1 class="t">' +
    (t.outcome === "ok" ? esc(t.outName) + " أخد أعلى الأصوات" : t.outcome === "tie" ? "التصويت اتعادل" : "محدش صوّت") + "</h1>" +
    '<p class="d" style="margin-bottom:12px">' +
    (t.outcome === "ok" ? "لسه محددناش هويته — استنوا الصباح."
      : t.outcome === "tie" ? "المتعادلين مش هيصوّتوا في الإعادة، والباقي هيختاروا من بينهم لحد ما حد يطلع."
      : "مفيش حد هيطلع النهارده من التصويت.") + "</p>";
  h += '<div class="card">';
  if (!t.tally.length) h += '<p class="d">محدش صوّت النهارده.</p>';
  var maxCount = t.tally.reduce(function (m, r) { return Math.max(m, r.count); }, 0);
  t.tally.forEach(function (r, i) {
    var isLead = t.outcome === "tie" ? (r.count === maxCount && maxCount > 0) : (r.name === t.outName);
    h += '<div class="vr' + (isLead ? " lead" : "") + '" data-a="voteStat:' + i + '" style="cursor:pointer">' +
      '<div class="nm">' + esc(r.name) +
      '<span style="display:block;font-size:11.5px;color:var(--muted);font-weight:500">' +
      (r.voters.length ? "صوّتوا عليه: " + esc(r.voters.join("، ")) : "") + "</span></div>" +
      '<div class="c">' + ar(r.count) + "</div>" +
      '<span style="font-size:15px;color:var(--faint);margin-inline-start:4px">›</span></div>';
  });
  h += "</div>";

function nightScreen() {
