*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --ink:#16122A;--ink2:#221C3D;--ink3:#2C2450;--line:#3B3168;
  --parch:#F3E9D6;--muted:#A398C7;--faint:#6F639A;
  --saffron:#E9A33C;--madder:#D1483F;--teal:#3EA08D;--violet:#9B6BD6;
  --disp:'Lalezar','Tajawal','Noto Kufi Arabic',system-ui,sans-serif;
  --logo:'Rakkas','Lalezar','Noto Kufi Arabic',serif;
  --body:'Tajawal','Noto Kufi Arabic',system-ui,sans-serif;
}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{
  background:var(--ink);color:var(--parch);font-family:var(--body);
  -webkit-user-select:none;user-select:none;
  background-image:
    radial-gradient(ellipse 130% 55% at 50% -12%,rgba(233,163,60,.2),rgba(22,18,42,0) 65%),
    radial-gradient(ellipse 100% 45% at 50% 112%,rgba(90,60,160,.14),rgba(22,18,42,0) 60%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='56'><g fill='none' stroke='%23F3E9D6' stroke-opacity='.055'><rect x='14' y='14' width='28' height='28'/><rect x='14' y='14' width='28' height='28' transform='rotate(45 28 28)'/><circle cx='28' cy='28' r='3.5'/></g></svg>");
  background-attachment:fixed;
}
#app{max-width:460px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 10px) 18px calc(env(safe-area-inset-bottom) + 20px);
  min-height:100dvh;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:8px;padding:6px 0 4px}
.grow{flex:1}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px 0}
.ctr{text-align:center}
.ico{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);
  color:var(--parch);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px}
.ico:active{transform:scale(.94)}
.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 12px;white-space:nowrap}
.logo{font-family:var(--logo);font-size:44px;line-height:1.25;text-align:center;margin:0}
.logo .g{color:var(--saffron)}
h1.t{font-family:var(--disp);font-size:30px;line-height:1.4;margin:0 0 6px;font-weight:400}
h2.t{font-family:var(--disp);font-size:21px;line-height:1.5;margin:0 0 4px;font-weight:400}
p.d{font-size:15px;line-height:1.75;color:var(--muted);margin:0}
.eb{font-size:12.5px;font-weight:700;letter-spacing:2px;color:var(--saffron);margin:0 0 10px}
.fine{font-size:11.5px;color:var(--faint);line-height:1.9;text-align:center}
.btn{width:100%;border:none;border-radius:16px;padding:17px 18px;font-family:var(--disp);font-size:19px;
  letter-spacing:.4px;background:linear-gradient(180deg,#F5BC66,#DE9226);color:#221602;cursor:pointer;
  display:block;text-align:center;transition:transform .1s,box-shadow .1s;
  box-shadow:0 5px 0 #8E5E14,0 10px 20px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8E5E14,0 5px 10px rgba(0,0,0,.3)}
.btn:disabled{opacity:.32}
.btn.ghost{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01));
  border:1px solid var(--line);color:var(--parch);box-shadow:0 3px 8px rgba(0,0,0,.3)}
.btn.ghost:active{transform:translateY(1px)}
.btn.dark{background:linear-gradient(180deg,#2A2350,#1D1839);border:1px solid var(--line);color:var(--parch);
  box-shadow:0 4px 0 #120E26,0 8px 16px rgba(0,0,0,.35)}

<script>

(function (global) {
"use strict";
/* ------------------------------ الأدوار ------------------------------ */
const ROLES = {
  villager: { key: "villager", label: "أهل قرية", team: "village", color: "#3EA08D", ink: "#0E2521" },
  thief:    { key: "thief",    label: "حرامي",    team: "thieves", color: "#D1483F", ink: "#2B0B09" },
  doctor:   { key: "doctor",   label: "دكتور",    team: "village", color: "#CFE8E1", ink: "#12302B" },
  cop:      { key: "cop",      label: "ضابط",     team: "village", color: "#E9A33C", ink: "#221602" },
  traitor:  { key: "traitor",  label: "خاين",     team: "solo",    color: "#9B6BD6", ink: "#180B2B" },
};

const ROLE_DESC = {
  villager: "مالكش قدرة خاصة. سلاحك كلامك — اكشف الحرامية قبل ما يخلّصوا عليكم.",
  thief: "بالليل بتتفق مع شركاك على ضحية. بالنهار مثّل إنك واحد منهم.",
  doctor: "كل ليلة بتنقذ حد — من غير ما تعرف مين اللي اتضرب.",
  cop: "كل ليلة بتضرب واحد بتشك فيه. لو غلطت، تبقى خسّرت بريء.",
  traitor: "مالكش صف. عندك مهمة سرية لازم تعملها — محدش يعرفك، ولو فشلت هتتفضح.",
};

const DEFAULT_CFG = {
  thieves: 1, doctor: false, cop: false, traitor: false, nightKill: false,
  talkSeconds: 120, voteSeconds: 60, talkRounds: 2,
};

function suggestCfg(n) {
  const base = { talkSeconds: 120, voteSeconds: 60, talkRounds: 2 };
  if (n <= 5) return { ...base, thieves: 1, doctor: false, cop: false, traitor: false, nightKill: false };
  if (n <= 7) return { ...base, thieves: 2, doctor: true, cop: false, traitor: false, nightKill: false };
  if (n <= 8) return { ...base, thieves: 2, doctor: true, cop: true, traitor: false, nightKill: true };
  if (n <= 11) return { ...base, thieves: 2, doctor: true, cop: true, traitor: true, nightKill: true };
  return { ...base, thieves: 3, doctor: true, cop: true, traitor: true, nightKill: true };
}

function validateCfg(cfg, n) {
  const maxTh = Math.max(1, Math.floor((n - 1) / 2));
  if (n < 3) return "لازم ٣ لاعبين على الأقل.";
  if (n > 15) return "أقصى عدد ١٥ لاعب.";
  if (cfg.thieves < 1 || cfg.thieves > maxTh) return `عدد الحرامية لازم يكون من ١ لـ ${maxTh}.`;
  const taken = cfg.thieves + (cfg.doctor ? 1 : 0) + (cfg.cop ? 1 : 0) + (cfg.traitor ? 1 : 0);
  if (n - taken < 1) return "لازم يفضل واحد على الأقل من أهل القرية.";
  return null;
}

/* ------------------------------ مهام الخاين ------------------------------ */
const MISSIONS = [
  { id: "outFirstVote", hard: "متوسطة", t: () => "تطلع برّا الدور بالتصويت في اليوم الأول.",
    check: (c) => (c.myOut && c.myOut.day === 1 && c.myOut.by === "vote") ? "win" : (c.day >= 1 ? "fail" : "wait") },

  { id: "firstOut", hard: "صعبة", t: () => "تكون أول واحد يطلع برّا الدور في اللعبة كلها.",
    check: (c) => { const f = c.log.outs[0]; if (f) return f.id === c.meId ? "win" : "fail"; return c.ended ? "fail" : "wait"; } },

  { id: "surviveAll", hard: "صعبة", t: () => "تفضل عايش لحد ما اللعبة تخلص، متطلعش خالص.",
    check: (c) => c.myOut ? "fail" : (c.ended ? "win" : "wait") },

  { id: "thievesWin", hard: "صعبة", t: () => "خلّي الحرامية يكسبوا اللعبة.",
    check: (c) => c.ended ? (c.result === "thieves" ? "win" : "fail") : "wait" },

  { id: "villageWin", hard: "متوسطة", t: () => "خلّي أهل القرية يكسبوا اللعبة.",
    check: (c) => c.ended ? (c.result === "village" ? "win" : "fail") : "wait" },

  { id: "thiefOutDay1", hard: "متوسطة", t: () => "خلّي حرامي واحد على الأقل يطلع من اليوم الأول.",
    check: (c) => c.log.outs.some((o) => o.day === 1 && c.roleOf(o.id) === "thief") ? "win" : (c.day >= 1 ? "fail" : "wait") },

  { id: "innocentOutDay1", hard: "سهلة", t: () => "خلّي واحد بريء (مش حرامي) يطلع بالتصويت في اليوم الأول.",
    check: (c) => c.log.outs.some((o) => o.day === 1 && o.by === "vote" && c.roleOf(o.id) !== "thief") ? "win" : (c.day >= 1 ? "fail" : "wait") },

  { id: "targetOut", hard: "سهلة", needTarget: true, t: (nm) => `خلّي ${nm} يطلع برّا الدور قبل ما اللعبة تخلص.`,
    check: (c) => c.log.outs.some((o) => o.id === c.target) ? "win" : (c.ended ? "fail" : "wait") },

  { id: "targetSurvive", hard: "متوسطة", needTarget: true, t: (nm) => `احمي ${nm} — لازم يفضل عايش لآخر اللعبة.`,
    check: (c) => c.log.outs.some((o) => o.id === c.target) ? "fail" : (c.ended ? "win" : "wait") },

  { id: "reachDay4", hard: "سهلة", t: () => "خلّي اللعبة توصل لليوم الرابع.",
    check: (c) => (c.day >= 4 || (!c.ended && c.day >= 3)) ? "win" : (c.ended ? "fail" : "wait") },

  { id: "noVotesTwice", hard: "صعبة", t: () => "متاخدش ولا صوت واحد في أول تصويتين.",
    check: (c) => { const v = c.log.votes.slice(0, 2);
      if (v.some((x) => (x.counts[c.meId] || 0) > 0)) return "fail";
      return (v.length >= 2 || c.ended) ? "win" : "wait"; } },

  { id: "threeVotesSurvive", hard: "صعبة", t: () => "خد ٣ أصوات أو أكتر في تصويت واحد، وتفضل عايش لآخر اليوم ده.",
    check: (c) => c.log.votes.some((v) => (v.counts[c.meId] || 0) >= 3 &&
      !c.log.outs.some((o) => o.day === v.day && o.id === c.meId)) ? "win" : (c.ended ? "fail" : "wait") },

  { id: "dieByThieves", hard: "متوسطة", need: (g) => g.nightKill, t: () => "اتضرب من الحرامية بالليل — ده اللي لازم يخلّصك.",
    check: (c) => c.myOut ? (c.myOut.by === "thief" ? "win" : "fail") : (c.ended ? "fail" : "wait") },

  { id: "dieByCop", hard: "صعبة", need: (g) => g.cop, t: () => "خلّي الضابط يضربك أنت بالذات.",
    check: (c) => c.myOut ? (c.myOut.by === "cop" ? "win" : "fail") : (c.ended ? "fail" : "wait") },

  { id: "healedOnce", hard: "متوسطة", need: (g) => g.doctor, t: () => "خلّي الدكتور يعالجك أنت مرة واحدة على الأقل.",
    check: (c) => c.log.healed.some((h) => h.id === c.meId) ? "win" : (c.ended ? "fail" : "wait") },

  { id: "doctorOut", hard: "سهلة", need: (g) => g.doctor, t: () => "خلّي الدكتور يطلع برّا الدور.",
    check: (c) => c.log.outs.some((o) => c.roleOf(o.id) === "doctor") ? "win" : (c.ended ? "fail" : "wait") },

  { id: "copOut", hard: "متوسطة", need: (g) => g.cop, t: () => "خلّي الضابط يطلع برّا الدور.",
    check: (c) => c.log.outs.some((o) => c.roleOf(o.id) === "cop") ? "win" : (c.ended ? "fail" : "wait") },

  { id: "quietDay", hard: "صعبة", t: () => "خلّي يوم كامل يعدّي من غير ما يطلع ولا لاعب واحد.",
    check: (c) => { for (let d = 1; d <= c.day; d++) if (!c.log.outs.some((o) => o.day === d)) return "win";
      return c.ended ? "fail" : "wait"; } },

  { id: "survive3Days", hard: "متوسطة", t: () => "تعيش لحد اليوم التالت على الأقل.",
    check: (c) => { if (c.myOut && c.myOut.day < 3) return "fail"; if (!c.myOut && c.day >= 3) return "win";
      return c.ended ? (c.myOut ? "fail" : "win") : "wait"; } },

  { id: "lastThree", hard: "صعبة", t: () => "تفضل واحد من آخر ٣ لاعبين في الدور.",
    check: (c) => { if (c.myOut) return "fail"; if (c.aliveCount <= 3) return "win"; return c.ended ? "fail" : "wait"; } },

  { id: "threeOutOneDay", hard: "صعبة", need: (g) => g.nightKill && g.cop, t: () => "خلّي تلاتة يطلعوا برّا في يوم واحد.",
    check: (c) => { for (let d = 1; d <= c.day; d++) if (c.log.outs.filter((o) => o.day === d).length >= 3) return "win";
      return c.ended ? "fail" : "wait"; } },

  { id: "noOneOutDay1", hard: "صعبة", need: (g) => !g.nightKill && !g.cop, t: () => "خلّي اليوم الأول يعدّي من غير ما يطلع حد خالص.",
    check: (c) => c.day >= 1 ? (c.log.outs.some((o) => o.day === 1) ? "fail" : "win") : "wait" },

  { id: "outByVote", hard: "متوسطة", t: () => "تطلع برّا بالتصويت — مش بضربة ليل.",
    check: (c) => c.myOut ? (c.myOut.by === "vote" ? "win" : "fail") : (c.ended ? "fail" : "wait") },

  { id: "thiefOutByVote", hard: "متوسطة", t: () => "خلّي حرامي يطلع برّا بالتصويت مش بأي طريقة تانية.",
    check: (c) => c.log.outs.some((o) => o.by === "vote" && c.roleOf(o.id) === "thief") ? "win" : (c.ended ? "fail" : "wait") },

  { id: "twoInnocentsOut", hard: "متوسطة", t: () => "خلّي اتنين أبرياء يطلعوا بالتصويت.",
    check: (c) => c.log.outs.filter((o) => o.by === "vote" && c.roleOf(o.id) !== "thief" && o.id !== c.meId).length >= 2
      ? "win" : (c.ended ? "fail" : "wait") },

  { id: "outlivedThief", hard: "سهلة", t: () => "تفضل عايش بعد ما أول حرامي يطلع برّا.",
    check: (c) => { const t = c.log.outs.find((o) => c.roleOf(o.id) === "thief");
      if (t) return c.myOut ? "fail" : "win";
      return (c.ended || c.myOut) ? "fail" : "wait"; } },
];

/* ------------------------------ أدوات ------------------------------ */
var now = () => Date.now(); // قابلة للاستبدال في الاختبارات
function rand(n) { return Math.floor(Math.random() * n); }

function shuffle(a, rnd = Math.random) {
  const x = a.slice();
  for (let i = x.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [x[i], x[j]] = [x[j], x[i]]; }
  return x;
}

function makeCode(taken = {}) {
  const A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let c;
  do { c = Array.from({ length: 4 }, () => A[rand(A.length)]).join(""); } while (taken[c]);
  return c;
}

const alivePlayers = (s) => s.players.filter((p) => p.alive);
/** زي alivePlayers بس بيستبعد الخاين بعد ما يتكشف — مالوش حق يصوّت ولا
 *  يُصوَّت عليه، بس بيفضل يشارك في الكلام عادي زي أهل القرية. */
const votingEligible = (s) => alivePlayers(s).filter((p) => !(s.missionShown && p.role === "traitor"));
const findPlayer = (s, id) => s.players.find((p) => p.id === id) || null;
const roleOf = (s, id) => { const p = findPlayer(s, id); return p ? p.role : null; };
const thievesAlive = (s) => alivePlayers(s).filter((p) => p.role === "thief");

function winner(s) {
  const alive = alivePlayers(s);
  const th = alive.filter((p) => p.role === "thief").length;
  if (th === 0) return "village";
  if (th >= alive.length - th) return "thieves";
  return null;
}

function pickMission(cfg, players) {
  const pool = MISSIONS.filter((m) => !m.need || m.need(cfg));
  const m = pool[rand(pool.length)];
  const me = players.find((p) => p.role === "traitor");
  let target = null, tname = "";
  if (m.needTarget) {
    const others = players.filter((p) => !me || p.id !== me.id);
    const pick = others[rand(others.length)];
    target = pick.id; tname = pick.name;
  }
  return { id: m.id, hard: m.hard, target, text: m.t(tname) };
}

function evalMission(s) {
  if (!s.mission || s.missionStatus !== "wait") return s.missionStatus || "wait";
  const def = MISSIONS.find((m) => m.id === s.mission.id);
  if (!def) return "wait";
  const me = s.players.find((p) => p.role === "traitor");
  return def.check({
    meId: me ? me.id : null,
    target: s.mission.target,
    roleOf: (id) => roleOf(s, id),
    myOut: s.log.outs.find((o) => me && o.id === me.id) || null,
    log: s.log,
    day: s.day,
    ended: !!s.result,
    result: s.result,
    aliveCount: alivePlayers(s).length,
  });
}

/* ------------------------------ إنشاء اللعبة ------------------------------ */
function createRoom(code, hostId) {
  return {
    code,
    hostId,
    phase: "lobby",
    cfg: { ...DEFAULT_CFG },
    cfgTouched: false,
    players: [],
    day: 0,
    talkRound: 1,
    votes: {},
    nominated: null,
    night: null,
    events: [],
    eventIdx: 0,
    log: { outs: [], healed: [], votes: [] },
    mission: null,
    missionStatus: "wait",
    missionShown: false,
    chat: [],
    result: null,
    deadline: null,
    version: 0,
  };
}

/** بيظبّط الأدوار تلقائي حسب عدد اللاعبين، طول ما المضيف مغيّرش حاجة بإيده */
function autoCfg(s) {
  if (s.cfgTouched || s.phase !== "lobby") return s;
  const n = s.players.length;
  if (n < 5) return s;
  const sg = suggestCfg(n);
  s.cfg = { ...s.cfg, thieves: sg.thieves, doctor: sg.doctor, cop: sg.cop, traitor: sg.traitor, nightKill: sg.nightKill };
  return s;
}

function addPlayer(s, { id, name, token }) {
  if (s.phase !== "lobby") throw new Error("اللعبة بدأت خلاص — مش هينفع حد يدخل دلوقتي.");
  if (s.players.length >= 15) throw new Error("الأوضة مليانة (١٥ لاعب).");
  const clean = String(name || "").trim().slice(0, 14) || `لاعب ${s.players.length + 1}`;
  if (s.players.some((p) => p.name === clean)) throw new Error("في حد بنفس الاسم — غيّره شوية.");
  s.players.push({ id, token, name: clean, role: null, alive: true, connected: true, seen: false });
  if (s.hostId === null || s.hostId === undefined) s.hostId = id;
  return s;
}

function removePlayer(s, id) {
  if (s.phase === "lobby") {
    s.players = s.players.filter((p) => p.id !== id);
    if (s.hostId === id && s.players[0]) s.hostId = s.players[0].id;
  } else {
    const p = findPlayer(s, id);
    if (p) p.connected = false;
  }
  return s;
}

function startGame(s) {
  const n = s.players.length;
  const err = validateCfg(s.cfg, n);
  if (err) throw new Error(err);

  const roles = [];
  for (let i = 0; i < s.cfg.thieves; i++) roles.push("thief");
  if (s.cfg.doctor) roles.push("doctor");
  if (s.cfg.cop) roles.push("cop");
  if (s.cfg.traitor) roles.push("traitor");
  while (roles.length < n) roles.push("villager");

  const mixed = shuffle(roles);
  s.players.forEach((p, i) => { p.role = mixed[i]; p.alive = true; p.seen = false; });

  s.mission = s.cfg.traitor ? pickMission(s.cfg, s.players) : null;
  s.missionStatus = "wait";
  s.missionShown = false;
  s.log = { outs: [], healed: [], votes: [] };
  s.day = 1; s.talkRound = 1; s.votes = {}; s.nominated = null;
  s.night = null; s.events = []; s.eventIdx = 0; s.result = null;
  s.phase = "reveal";
  s.deadline = null;
  return s;
}

function markSeen(s, id) {
  const p = findPlayer(s, id);
  if (p) p.seen = true;
  if (s.phase === "reveal" && s.players.every((x) => x.seen)) beginDay(s);
  return s;
}

function beginDay(s) {
  s.phase = "day";
  s.talkRound = 1;
  s.votes = {};
  s.nominated = null;
  s.deadline = null; // التايمر مقفول افتراضيًا — المضيف يشغّله يدويًا لو عايز
  return s;
}

function nextTalkRound(s) {
  if (s.talkRound < s.cfg.talkRounds) {
    s.talkRound += 1;
    s.deadline = null; // برضو مقفول للراوند الجديد
  } else beginVote(s);
  return s;
}

function beginVote(s) {
  s.phase = "vote";
  s.voteOutcome = null;
  s.votes = {};
  s.deadline = now() + s.cfg.voteSeconds * 1000;
  return s;
}

function castVote(s, voterId, targetId) {
  if (s.phase !== "vote") throw new Error("مش وقت تصويت دلوقتي.");
  const v = findPlayer(s, voterId);
  if (!v || !v.alive) throw new Error("اللي طلع برّا مبيصوّتش.");
  if (s.missionShown && v.role === "traitor") throw new Error("الخاين اتكشف، مبقاش ليه حق التصويت.");
  if (targetId !== null) {
    const t = findPlayer(s, targetId);
    if (!t || !t.alive) throw new Error("اللاعب ده مش في الدور.");
    if (s.missionShown && t.role === "traitor") throw new Error("محدش يقدر يصوّت على الخاين بعد ما اتكشف.");
  }
  s.votes[voterId] = targetId;
  const everyone = votingEligible(s).every((p) => p.id in s.votes);
  return { state: s, complete: everyone };
}

function voteCounts(s) {
  const counts = {};
  votingEligible(s).forEach((p) => (counts[p.id] = 0));
  Object.values(s.votes).forEach((t) => { if (t !== null && t in counts) counts[t] += 1; });
  return counts;
}

/** بيقفل التصويت. بيرجّع 'tie' | 'none' | 'ok' */
function closeVote(s) {
  const counts = voteCounts(s);
  let max = 0, best = [];
  Object.keys(counts).forEach((k) => {
    const id = Number(k);
    if (counts[id] > max) { max = counts[id]; best = [id]; }
    else if (counts[id] === max && max > 0) best.push(id);
  });
  s._counts = counts;
  s._rawVotes = { ...s.votes }; // نسخة من مين صوّت على مين — قبل ما votes يتصفّر للراوند الجاي
  if (max === 0) { s.nominated = null; s.voteOutcome = "none"; return "none"; }
  if (best.length > 1) { s.nominated = null; s.voteOutcome = "tie"; return "tie"; }
  s.nominated = best[0];
  s.voteOutcome = "ok";
  return "ok";
}

/* ------------------------------ الليل ------------------------------ */
function nightOrder(s) {
  const order = [];
  if (s.cfg.nightKill && thievesAlive(s).length) order.push("thieves");
  if (s.cfg.cop && alivePlayers(s).some((p) => p.role === "cop")) order.push("cop");
  if (s.cfg.doctor && alivePlayers(s).some((p) => p.role === "doctor")) {
    const confirmOnly = !s.cfg.nightKill && !s.cfg.cop;
    if (!confirmOnly || s.nominated !== null) order.push("doctor");
  }
  return order;
}

const doctorHeals = (cfg) => (cfg.nightKill || cfg.cop ? 2 : 1);
const doctorConfirmMode = (cfg) => !cfg.nightKill && !cfg.cop;

function beginNight(s) {
  const order = nightOrder(s);
  if (!order.length) return resolveMorning(s);
  s.phase = "night";
  s.night = { order, idx: 0, thief: null, cop: null, healed: [], picks: {} };
  s.deadline = null;
  return s;
}

/** الحرامية بيصوّتوا بينهم؛ الضابط والدكتور بيختاروا لوحدهم. */
function nightAction(s, playerId, payload) {
  if (s.phase !== "night") throw new Error("مش وقت ليل دلوقتي.");
  const step = s.night.order[s.night.idx];
  const me = findPlayer(s, playerId);
  if (!me || !me.alive) throw new Error("اللي طلع برّا مش بيلعب بالليل.");

  if (step === "thieves") {
    if (me.role !== "thief") throw new Error("الدور مش عليك.");
    const t = findPlayer(s, payload.target);
    if (!t || !t.alive) throw new Error("اختار حد لسه في الدور.");
    if (t.role === "thief") throw new Error("الحرامية مايضربوش بعض.");
    s.night.picks[playerId] = payload.target;
    const all = thievesAlive(s).every((p) => p.id in s.night.picks);
    if (!all) return { state: s, advanced: false };
    const tally = {};
    Object.values(s.night.picks).forEach((id) => (tally[id] = (tally[id] || 0) + 1));
    let top = null, best = -1;
    Object.keys(tally).forEach((k) => { if (tally[k] > best) { best = tally[k]; top = Number(k); } });
    s.night.thief = top;
    s.night.picks = {};
    return { state: advanceNight(s), advanced: true };
  }

  if (step === "cop") {
    if (me.role !== "cop") throw new Error("الدور مش عليك.");
    const t = findPlayer(s, payload.target);
    if (!t || !t.alive || t.id === playerId) throw new Error("اختار حد تاني لسه في الدور.");
    s.night.cop = payload.target;
    return { state: advanceNight(s), advanced: true };
  }

  if (step === "doctor") {
    if (me.role !== "doctor") throw new Error("الدور مش عليك.");
    if (doctorConfirmMode(s.cfg)) {
      s.night.healed = payload.heal ? [s.nominated] : [];
    } else {
      const list = (payload.targets || []).slice(0, doctorHeals(s.cfg));
      if (!list.length) throw new Error("اختار واحد على الأقل.");
      if (list.some((id) => { const p = findPlayer(s, id); return !p || !p.alive; })) throw new Error("في حد اخترته مش في الدور.");
      s.night.healed = list;
    }
    return { state: advanceNight(s), advanced: true };
  }

  throw new Error("خطوة غير معروفة.");
}

function advanceNight(s) {
  s.night.idx += 1;
  if (s.night.idx >= s.night.order.length) return resolveMorning(s);
  return s;
}

/* ------------------------------ الصباح ------------------------------ */
function resolveMorning(s) {
  const n = s.night || { thief: null, cop: null, healed: [] };
  const healed = n.healed || [];
  const ev = [];
  if (n.thief !== null && n.thief !== undefined) ev.push({ kind: "thief", target: n.thief, saved: healed.includes(n.thief) });
  if (n.cop !== null && n.cop !== undefined) ev.push({ kind: "cop", target: n.cop, saved: healed.includes(n.cop) });
  if (s.nominated !== null && s.nominated !== undefined) ev.push({ kind: "vote", target: s.nominated, saved: healed.includes(s.nominated) });

  const dead = new Set(ev.filter((e) => !e.saved).map((e) => e.target));
  s.players.forEach((p) => { if (dead.has(p.id)) p.alive = false; });

  ev.filter((e) => !e.saved).forEach((e) => s.log.outs.push({ id: e.target, day: s.day, by: e.kind }));
  healed.forEach((id) => s.log.healed.push({ id, day: s.day }));
  s.log.votes.push({ day: s.day, counts: s._counts || {}, out: s.nominated, raw: s._rawVotes || {} });
  delete s._counts;
  delete s._rawVotes;

  s.events = ev;
  s.eventIdx = 0;
  s.result = winner(s);
  s.night = null;

  const st = evalMission(s);
  if (st !== "wait") s.missionStatus = st;

  s.phase = "morning";
  s.deadline = null;
  return s;
}

/** بيقلّب على خبر الصباح اللي بعده. بيرجّع true لو فاضل أخبار. */
function nextEvent(s) {
  if (s.phase !== "morning") return false;
  if (s.eventIdx + 1 < s.events.length) { s.eventIdx += 1; return true; }
  return false;
}

/** بيتنادى لما الكل يخلص قراية أخبار الصباح. */
function afterMorning(s) {
  const traitor = s.players.find((p) => p.role === "traitor");
  if (s.cfg.traitor && traitor && !s.missionShown) {
    if (s.missionStatus === "fail") { s.phase = "traitor"; return s; }
    if (s.missionStatus === "win" && !traitor.alive && !s.result) { s.phase = "traitor"; return s; }
  }
  return proceed(s);
}

function proceed(s) {
  // بنعلّم إن الخاين اتعرض بس لما نكون فعلاً خارجين من شاشة كشفه،
  // مش كل ما اليوم يعدّي — الغلطة دي كانت بتخلي الخاين ميتكشفش أبدًا
  // لو مهمته فشلت في يوم متأخر.
  if (s.phase === "traitor") s.missionShown = true;
  if (s.result) { s.phase = "over"; s.deadline = null; return s; }
  s.day += 1;
  return beginDay(s);
}

/* ------------------------------ العرض لكل لاعب ------------------------------ */
/**
 * أهم دالة في الملف: بترجّع نسخة من الحالة *مفلترة* حسب اللاعب،
 * فمستحيل يوصل لموبايل حد معلومة مش من حقه — حتى لو فتح أدوات المطوّر.
 */
function viewFor(s, playerId) {
  const me = findPlayer(s, playerId);
  const revealed = (p) => !p.alive || s.phase === "over" || (s.missionShown && p.role === "traitor");
  const iAmThief = me && me.role === "thief";

  const players = s.players.map((p) => ({
    id: p.id,
    name: p.name,
    alive: p.alive,
    connected: p.connected,
    seen: p.seen,
    isHost: p.id === s.hostId,
    voted: s.phase === "vote" ? p.id in s.votes : null,
    // الدور بيتبعت بس لو: أنا هو، أو طلع برّا، أو اللعبة خلصت، أو إحنا حرامية مع بعض
    role: (me && p.id === me.id) || revealed(p) || (iAmThief && p.role === "thief" && s.phase !== "lobby")
      ? p.role : null,
  }));

  const step = s.phase === "night" && s.night ? s.night.order[s.night.idx] : null;
  const myTurn =
    step === "thieves" ? !!(me && me.role === "thief" && me.alive && !(me.id in s.night.picks)) :
    step === "cop" ? !!(me && me.role === "cop" && me.alive) :
    step === "doctor" ? !!(me && me.role === "doctor" && me.alive) : false;

  return {
    code: s.code,
    phase: s.phase,
    cfg: s.cfg,
    cfgTouched: !!s.cfgTouched,
    missionShown: !!s.missionShown,
    chat: s.chat || [],
    chatEnabled: s.chatEnabled !== false,
    day: s.day,
    talkRound: s.talkRound,
    talkRounds: s.cfg.talkRounds,
    deadline: s.deadline,
    players,
    you: me ? {
      id: me.id, name: me.name, alive: me.alive, isHost: me.id === s.hostId, seen: me.seen,
      role: me.role,
      partners: me.role === "thief" ? s.players.filter((p) => p.role === "thief" && p.id !== me.id).map((p) => p.name) : [],
      mission: me.role === "traitor" ? s.mission : null,
      myVote: s.phase === "vote" ? (s.votes[me.id] ?? null) : null,
    } : null,
    nightStep: step,
    myTurn,

function wipeHeartbeatDB() {
  return new Promise(function (resolve) {
    try {
      if (!window.indexedDB || !indexedDB.deleteDatabase) return resolve();
      var req = indexedDB.deleteDatabase("firebase-heartbeat-database");
      req.onsuccess = function () { resolve(); };

function voteScreen() {
  var left = state.deadline ? Math.max(0, (state.deadline - Date.now()) / 1000) : null;
  var alive = state.players.filter(function (p) { return p.alive && !(state.missionShown && p.role === "traitor"); });
  var iAmRevealedTraitor = state.missionShown && state.you.role === "traitor";
  var canVote = state.you.alive && !iAmRevealedTraitor;

  var h = '<p class="eb">التصويت · باقي ' + mmss(left || 0) + '</p><h1 class="t">' +
    (iAmRevealedTraitor ? "اتكشفت كخاين" : state.you.alive ? "على مين شاكك؟" : "أنت برّا الدور") + "</h1>" +
    '<p class="d" style="margin-bottom:12px">' +
    (iAmRevealedTraitor ? "بعد ما اتكشفت، مبقاش ليك حق التصويت — بس شارك في الكلام وساعد أهل القرية عادي." :

  alive.filter(function (p) { return p.id !== state.you.id; }).forEach(function (p) {
    h += '<button data-a="vote:' + p.id + '" class="pick' + (myVote === p.id ? " sel" : "") + '"' + (!canVote ? " disabled" : "") + ">" +

}

function tallyScreen() {

  var title = { thieves: "دور الحرامية", cop: "دور الضابط", doctor: "دور الدكتور" }[step];

  }

        '<div class="c">' + ar(t.count) + "</div></div>";

  });
  return h + "</div>";
}

var chatOpen = false;
var chatSeenCount = 0; // آخر عدد رسائل شافه المستخدم — عشان نعرف نعرض نقطة "جديد"
function chatAvailable() { return !!(client && state && state.chatEnabled); }
function chatToggleHTML() {
  if (!chatAvailable()) return "";
  var unread = state && state.chat ? state.chat.length - chatSeenCount : 0;
  return '<button id="chatbtn" style="position:fixed;bottom:56px;right:10px;z-index:150;width:40px;height:40px;' +
    'border-radius:50%;border:1px solid rgba(233,163,60,.35);background:rgba(50,40,20,.92);' +
    'display:flex;align-items:center;justify-content:center;font-size:17px;cursor:pointer;' +
    'box-shadow:0 3px 10px rgba(0,0,0,.35)">💬' +
    (unread > 0 ? '<span style="position:absolute;top:-3px;left:-3px;background:var(--madder);color:#fff;' +
      'font-family:var(--body);font-size:9.5px;font-weight:800;border-radius:50%;width:16px;height:16px;' +
      'display:flex;align-items:center;justify-content:center">' + Math.min(unread, 9) + '</span>' : '') +
    '</button>';
}
function renderChatPanel() {
  var host = document.getElementById("chatpanel");
  if (!chatOpen || !chatAvailable()) { if (host) host.remove(); return; }
  var msgs = (state && state.chat) || [];
  var wasFocused = false, prevValue = "";
  var oldInput = document.getElementById("chatinput");
  if (oldInput) { wasFocused = document.activeElement === oldInput; prevValue = oldInput.value; }
  if (!host) {
    host = document.createElement("div");
    host.id = "chatpanel";
    host.style.cssText = "position:fixed;bottom:100px;right:10px;left:10px;max-width:380px;margin:0 auto;" +
      "max-height:52vh;background:rgba(20,16,38,.97);border:1px solid rgba(233,163,60,.25);border-radius:16px;" +
      "z-index:150;display:flex;flex-direction:column;box-shadow:0 12px 30px rgba(0,0,0,.5);overflow:hidden";
    document.body.appendChild(host);
  }
  var myId = state && state.you ? state.you.id : null;
  var list = msgs.map(function (m) {
    var mine = m.from === myId;
    return '<div style="display:flex;flex-direction:column;align-items:' + (mine ? "flex-end" : "flex-start") + ';margin-bottom:8px">' +
      '<span style="font-size:10.5px;color:var(--muted);margin-bottom:2px">' + esc(m.name) + '</span>' +
      '<span style="background:' + (mine ? "linear-gradient(180deg,#3A2F63,#2A2350)" : "linear-gradient(180deg,#262046,#1E1938)") +
      ';color:var(--parch);padding:8px 12px;border-radius:13px;font-size:13.5px;max-width:80%;word-break:break-word">' +
      esc(m.text) + "</span></div>";
  }).join("");
  host.innerHTML = '<div style="padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.08);' +
    'display:flex;justify-content:space-between;align-items:center">' +
    '<b style="font-size:13px;color:var(--saffron)">الشات</b>' +
    '<button id="chatclose" style="background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer">✕</button></div>' +
    '<div id="chatlist" style="flex:1;overflow-y:auto;padding:12px">' + (list || '<p class="d" style="text-align:center">لسه مفيش رسايل…</p>') + '</div>' +
    '<div style="display:flex;gap:7px;padding:10px;border-top:1px solid rgba(255,255,255,.08)">' +
    '<input id="chatinput" class="input" style="flex:1;margin:0" placeholder="اكتب رسالة…" maxlength="300">' +
    '<button id="chatsend" class="btn" style="width:auto;padding:0 16px;margin:0">ابعت</button></div>';
  var listEl = document.getElementById("chatlist");
  listEl.scrollTop = listEl.scrollHeight;
  var newInput = document.getElementById("chatinput");
  if (newInput && prevValue) newInput.value = prevValue;
  if (newInput && wasFocused) newInput.focus();
  chatSeenCount = msgs.length;
}
function sendChat(inputId) {
  var inp = document.getElementById(inputId || "chatinput");
  if (!inp || !inp.value.trim() || !client) return;
  var text = inp.value.trim();
  inp.value = ""; // نمسحها قبل الإرسال — لو الرد رجع فورًا ومسك رسم جديد، هيلاقيها فاضية أصلًا
  client.send({ t: "chat", text: text });
}
document.addEventListener("click", function (e) {
  if (e.target && e.target.id === "chatbtn") { chatOpen = !chatOpen; renderChatPanel(); renderChatToggle(); return; }
  if (e.target && e.target.id === "chatclose") { chatOpen = false; renderChatPanel(); renderChatToggle(); return; }
  if (e.target && e.target.id === "chatsend") { sendChat("chatinput"); return; }
  if (e.target && e.target.id === "lchatsend") { sendChat("lchatinput"); return; }
  if (e.target && e.target.id === "landscapebtn") { toggleLandscape(); return; }
});
document.addEventListener("keydown", function (e) {
  if (e.target && e.target.id === "chatinput" && e.key === "Enter") { sendChat("chatinput"); }
  if (e.target && e.target.id === "lchatinput" && e.key === "Enter") { sendChat("lchatinput"); }
});
function renderChatToggle() {

}

      "background:rgba(10,8,20,.96);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:10px;" +
      "z-index:150;font-family:monospace;font-size:10.5px;color:#B8AEDD;direction:ltr;text-align:left;line-height:1.6";
    document.body.appendChild(host);
  }
  host.innerHTML = lines.map(function (l) { return l.replace(/</g, "&lt;"); }).join("<br>") || "لسه مفيش سجل…";
  host.scrollTop = host.scrollHeight;
}
window.__onDebugLog = function () { if (debugOpen) renderDebugPanel(); };
document.addEventListener("click", function (e) {
  if (e.target && e.target.id === "dbgbtn") { debugOpen = !debugOpen; renderDebugPanel(); }
});

/* ---------------------------- وضع العرض العريض (بالثلاث أعمدة) ---------------------------- */
var landscapeMode = localStorage.getItem("haramia-landscape") === "1";
async function toggleLandscape() {
  landscapeMode = !landscapeMode;
  try { localStorage.setItem("haramia-landscape", landscapeMode ? "1" : "0"); } catch (e) {}
  if (landscapeMode) {
    // محاولة قفل اتجاه الشاشة فعليًا (مش مجرد تخطيط CSS) — ده مدعوم بس على
    // Android/Chrome وبس لما الصفحة تكون Fullscreen، ومش مدعوم خالص على
    // آيفون/سفاري. لو فشل، هنفضل نستخدم تخطيط الـCSS العريض زي ما هو —
    // بيشتغل في كل الحالات، بس من غير ما يقلب اتجاه الموبايل فعليًا.
    var locked = false;
    try {
      if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
      if (screen.orientation && screen.orientation.lock) { await screen.orientation.lock("landscape"); locked = true; }
    } catch (e) { /* الجهاز أو المتصفح مش بيدعم القفل الإجباري */ }
    if (!locked) showToast("المتصفح ده مش بيدعم قفل اتجاه الشاشة إجباريًا (شائع على آيفون) — التخطيط العريض هيفضل شغال، بس هتحتاج تلف الموبايل بنفسك.");
  } else {
    try { if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
    try { if (document.fullscreenElement && document.exitFullscreen) await document.exitFullscreen(); } catch (e) {}
  }
  render();
}
function chatMessagesListHTML() {
  var msgs = (state && state.chat) || [];
  var myId = state && state.you ? state.you.id : null;
  var list = msgs.map(function (m) {
    var mine = m.from === myId;
    return '<div style="display:flex;flex-direction:column;align-items:' + (mine ? "flex-end" : "flex-start") + ';margin-bottom:8px">' +
      '<span style="font-size:10px;color:var(--muted);margin-bottom:2px">' + esc(m.name) + '</span>' +
      '<span style="background:' + (mine ? "linear-gradient(180deg,#3A2F63,#2A2350)" : "linear-gradient(180deg,#262046,#1E1938)") +
      ';color:var(--parch);padding:7px 10px;border-radius:12px;font-size:12px;max-width:88%;word-break:break-word">' +
      esc(m.text) + "</span></div>";
  }).join("");
  return list || '<p class="d" style="text-align:center;font-size:11px">لسه مفيش رسايل…</p>';
}
function landscapeChatHTML() {
  return '<div class="lside"><div class="lhead">💬 الشات</div>' +
    '<div class="lbody" id="lchatlist">' + chatMessagesListHTML() + '</div>' +
    '<div class="lfoot" style="display:flex;gap:6px">' +
    '<input id="lchatinput" class="input" style="flex:1;margin:0;font-size:11.5px;padding:9px 10px" placeholder="اكتب…" maxlength="300">' +
    '<button id="lchatsend" class="btn" style="width:auto;padding:0 10px;margin:0;font-size:11.5px">ابعت</button></div></div>';
}
function gameLogHTML() {
  var log = (state && state.gameLog) || [];
  var rows = log.slice().reverse().map(function (e) {
    var text;
    if (e.kind === "vote") text = e.outcome === "out" ? esc(e.name) + " طلع بالتصويت" : e.outcome === "tie" ? "التصويت اتعادل" : "محدش خد صوت كفاية";
    else if (e.kind === "thief") text = esc(e.name) + " اتضرب بالليل";
    else if (e.kind === "cop") text = esc(e.name) + " ضربه الضابط";
    else if (e.kind === "saved") text = "حد اتضرب بالليل بس الدكتور عالجه وقام بالسلامة";
    else text = "";
    return '<div class="logrow"><span class="lday">يوم ' + ar(e.day) + "</span>" + text + "</div>";
  }).join("");
  return '<div class="lside"><div class="lhead">📜 اللي حصل</div><div class="lbody">' + (rows || '<p class="d" style="font-size:11px">لسه مفيش أحداث…</p>') + "</div></div>";
}

// باج معروف وموثّق في سفاري آيفون: حالة :active مبتشتغلش خالص من غير
// مستمع لمس فعلي على الصفحة. من غيره، كل تأثيرات الضغط اللي حطيناها
// على الأزرار (بارز، بيغطس) كانت هتفضل مش ظاهرة على آيفون تحديدًا.
document.addEventListener("touchstart", function () {}, { passive: true });

// طبقة تأكيد إضافية: أي حاجة قابلة للدوس بتاخد ومضة واضحة لحظة الضغط،
// بغض النظر عن :active — عشان الشخص يبقى متأكد ١٠٠٪ إنه داس صح.
document.addEventListener("pointerdown", function (e) {
  var el = e.target.closest("button, [data-a], [data-emo]");
  if (!el) return;
  el.classList.add("tapfx");
  setTimeout(function () { el.classList.remove("tapfx"); }, 180);
}, { passive: true });

var appEl = document.getElementById("app");
function render() {
  // لو أي خطأ حصل وقت بناء الشاشة، مننساش نحدّث الشاشة القديمة —
  // ده بالظبط اللي كان بيسبب "التجمّد": الشاشة الجديدة بتتبني كاملة
  // في الذاكرة الأول، فلو وقعت في النص، القديمة بتفضل زي ما هي للأبد.
  // دلوقتي أي خطأ رسم بيوري شاشة بديلة واضحة بدل ما يسيب المستخدم
  // واقف من غير ما يعرف حصل إيه. ولو الصفحة نفسها اتقفلت (document
  // بقى مش متاح) بنتجاهل كل حاجة بأمان تام من غير أي كراش.
  if (typeof document === "undefined" || !document.getElementById) return;
  var showLandscape = landscapeMode && client && state;
  var lWasFocused = false, lPrevValue = "";
  try {
    var lOldInput = document.getElementById("lchatinput");
    if (lOldInput) { lWasFocused = document.activeElement === lOldInput; lPrevValue = lOldInput.value; }
  } catch (e) { return; }
  try {
    var mid = view();
    appEl.innerHTML = showLandscape ? ('<div class="lwrap">' + landscapeChatHTML() + '<div class="lmid">' + mid + "</div>" + gameLogHTML() + "</div>") : mid;
    appEl.classList.toggle("lon", !!showLandscape);
  } catch (e) {
    if (window.__firebaseDebugLog) window.__firebaseDebugLog.push(
      new Date().toTimeString().slice(0, 8) + " — !! فشل بناء الشاشة: " + e.message + (e.stack ? " | " + e.stack.split("\n").slice(0, 2).join(" » ") : ""));
    try {
      appEl.innerHTML = '<div class="mid ctr"><div class="errbox">حصل خطأ في عرض الشاشة. دوس الزرار وجرّب تاني.</div>' +
        '<button class="btn dark" data-a="rerender">جرّب تاني</button></div>' + footer();
    } catch (e2) { /* الصفحة اتقفلت فعلًا */ }
    return;
  }
  try {
    if (state && state.phase === "reveal" && !state.you.seen) bindFlip();
    if (!showLandscape) renderChatPanel(); // في العرض العريض الشات ظاهر جوه العمود مش عايم
    renderChatToggle();
    if (showLandscape) restoreInlineChatInput(lPrevValue, lWasFocused);
  } catch (e) { /* الصفحة يمكن اتقفلت أو في تحديث متأخر وصل بعدها — نتجاهله بأمان */ }
}
function restoreInlineChatInput(prevValue, wasFocused) {
  var listEl = document.getElementById("lchatlist");
  if (listEl) listEl.scrollTop = listEl.scrollHeight;
  var inp = document.getElementById("lchatinput");
  if (inp && prevValue) inp.value = prevValue;
  if (inp && wasFocused) inp.focus();
}
function bindFlip() {
  var f = document.getElementById("flip"); if (!f) return;
  f.addEventListener("click", function (e) {
    e.preventDefault();
    var willOpen = !f.classList.contains("open");
    if (willOpen) buzz(22);
    f.classList.toggle("open", willOpen);
  });
  f.addEventListener("contextmenu", function (e) { e.preventDefault(); });
}

// عداد الوقت المرئي بس (المضيف هو اللي بيقرر فعليًا في الخلفية)
setInterval(function () {
  if (state && (state.phase === "day" || state.phase === "vote") && state.deadline) {
    var t = document.querySelector(".timer");
    if (t) t.textContent = mmss(Math.max(0, (state.deadline - Date.now()) / 1000));
  }
}, 1000);

// نبضة قلب دورية عشان اللاعبين يعرفوا إن المضيف لسه موجود
setInterval(function () { if (client && client.isHost && client.hostBrain) client.hostBrain.broadcast(); }, 8000);

// فحص دوري لغياب المضيف — بيعيد الرسم بس أول ما حالة التحذير فعلاً تتغيّر
setInterval(function () {
  if (!client || client.isHost) return;
  var stale = isHostStale();
  if (stale !== hostStaleShown) { hostStaleShown = stale; render(); }
}, 3000);

appEl.addEventListener("input", function (e) {
  var bind = e.target.getAttribute && e.target.getAttribute("data-bind");
  if (bind === "name") myName = e.target.value;
  if (bind === "code") joinCode = e.target.value.toUpperCase();
});

appEl.addEventListener("click", async function (e) {
  var emo = e.target.closest("[data-emo]");
  if (emo) { buzz(8); popEmoji(emo.getAttribute("data-emo")); if (client) client.send({ t: "emoji", e: emo.getAttribute("data-emo") }); return; }

  var el = e.target.closest("[data-a]"); if (!el) return;
  var a0 = el.getAttribute("data-a");
  if (a0 === "closeSheet") { if (e.target.closest("[data-stop]")) return; uiSheet = null; render(); return; }

  var parts = a0.split(":"), k = parts[0];
  buzz();

  if (k === "retry") { conn = "connecting"; render(); boot(); return; }
  if (k === "rerender") { render(); return; }
  if (k === "create") { doCreate(); return; }
  if (k === "join") { doJoin(); return; }
  if (k === "resume") { doResume(); return; }
  if (k === "leave") { doLeave(); return; }
  if (k === "about") { uiSheet = { t: "about" }; render(); return; }

  if (!client) return;

  if (k === "th") {
    var maxTh = Math.max(1, Math.floor((state.players.length - 1) / 2));
    var nv = Math.max(1, Math.min(maxTh, state.cfg.thieves + Number(parts[1])));
    client.send({ t: "cfg", cfg: Object.assign({}, state.cfg, { thieves: nv }) });
    return;
  }
  if (k === "tg") {
    var key = parts[1], patch = {}; patch[key] = !state.cfg[key];
    if (key === "cop" && patch.cop) patch.nightKill = true;
    client.send({ t: "cfg", cfg: Object.assign({}, state.cfg, patch) });
    return;
  }
  if (k === "toggleRoomChat") { client.send({ t: "setChatEnabled", value: !state.chatEnabled }); return; }
  if (k === "dtimer") { dayTimerChoice = Math.max(30, Math.min(120, dayTimerChoice + Number(parts[1]))); render(); return; }
  if (k === "startTimer") { client.send({ t: "startTimer", seconds: dayTimerChoice }); return; }
  if (k === "start") { client.send({ t: "start" }); return; }
  if (k === "seen") { client.send({ t: "seen" }); return; }
  if (k === "next") { client.send({ t: "next" }); return; }
  if (k === "vote") { client.send({ t: "vote", target: parts[1] === "null" ? null : Number(parts[1]) }); return; }
  if (k === "forceVote") { client.send({ t: "forceVote" }); return; }
  if (k === "tallyNext") { client.send({ t: "tallyNext" }); return; }
  if (k === "revote") { client.send({ t: "revote" }); return; }
  if (k === "heal") { client.send({ t: "night", heal: parts[1] === "1" }); return; }
  if (k === "npick") {
    var pid = Number(parts[1]);
    var multi = state.nightStep === "doctor" ? state.doctorHeals : 1;
    if (multi === 1) nightPicks = [pid];
    else {
      var i = nightPicks.indexOf(pid);
      if (i >= 0) nightPicks.splice(i, 1);
      else if (nightPicks.length < multi) nightPicks.push(pid);
    }
    document.querySelectorAll("#nightGrid .pick").forEach(function (b) {
      var id = Number(b.getAttribute("data-a").split(":")[1]);
      b.classList.toggle("sel", nightPicks.indexOf(id) >= 0);
    });
    var go = document.getElementById("nightGo");
    if (go) go.disabled = nightPicks.length !== multi;
    return;
  }
  if (k === "nightGo") {
    if (state.nightStep === "thieves" || state.nightStep === "cop") client.send({ t: "night", target: nightPicks[0] });
    else client.send({ t: "night", targets: nightPicks.slice() });
    nightPicks = [];
    return;
  }
  if (k === "morningNext") { client.send({ t: "morningNext" }); return; }
  if (k === "again") { client.send({ t: "again" }); return; }
  if (k === "restart") { client.send({ t: "restart" }); return; }
});

/* ---------------------------- شبكة أمان: نفضح أي خطأ صامت ---------------------------- */
/* أي عملية فايربيز فاشلة (زي كتابة اترفضت من قواعد الأمان) كانت بتختفي بصمت
 * من غير ما حد يعرف. دلوقتي أي خطأ زي ده هيظهر في توست واضح فوق الشاشة —
 * ده اللي هيوريني بالظبط إيه اللي بيحصل فعليًا مع فايربيز الحقيقي. */
var toasts = [];
function showToast(msg) {
  var id = Math.random().toString(36).slice(2);
  toasts.push({ id: id, msg: String(msg).slice(0, 220) });
  renderToasts();
  setTimeout(function () { toasts = toasts.filter(function (t) { return t.id !== id; }); renderToasts(); }, 9000);
}
function renderToasts() {
  var host = document.getElementById("toasts");
  if (!host) { host = document.createElement("div"); host.id = "toasts"; host.style.cssText = "position:fixed;top:8px;left:8px;right:8px;z-index:200;display:flex;flex-direction:column;gap:6px;pointer-events:none"; document.body.appendChild(host); }
  host.innerHTML = toasts.map(function (t) {
    return '<div style="background:linear-gradient(180deg,#E85C55,#B93A34);color:#fff;padding:10px 14px;border-radius:12px;font-family:Tajawal,sans-serif;font-size:12.5px;line-height:1.6;box-shadow:0 8px 20px rgba(0,0,0,.4);pointer-events:auto">⚠️ ' + t.msg.replace(/</g, "&lt;") + "</div>";
  }).join("");
}
window.addEventListener("unhandledrejection", function (e) {
  var m = (e.reason && (e.reason.code || e.reason.message)) || String(e.reason);
  var stack = e.reason && e.reason.stack ? " | " + e.reason.stack.split("\n").slice(0, 3).join(" » ") : "";
  showToast("خطأ غير متوقع: " + m);
  if (window.__firebaseDebugLog) window.__firebaseDebugLog.push(new Date().toTimeString().slice(0, 8) + " — !! رفض غير متوقع: " + m + stack);
});
window.addEventListener("error", function (e) {
  if (e.message) {
    var loc = e.filename ? (" [سطر " + e.lineno + ":" + e.colno + "]") : "";
    var stack = e.error && e.error.stack ? " | " + e.error.stack.split("\n").slice(0, 3).join(" » ") : "";
    if (window.__firebaseDebugLog) window.__firebaseDebugLog.push(new Date().toTimeString().slice(0, 8) + " — !! خطأ صفحة: " + e.message + loc + stack);
    showToast("خطأ في الصفحة: " + e.message + loc);
  }
});

    "border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(30,25,55,.9);color:#8B7FBF;" +
    "font-size:14px;cursor:pointer";
  l.textContent = "⛶";
  document.body.appendChild(l);
})();

render(); // نعرض "بنتوصّل…" فورًا — من غيرها الشاشة كانت تفضل فاضية تمامًا لحد ما فايربيز يرد
